<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grudge</title>
<meta name="theme-color" content="#e9a23b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grudge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 320x180 canvas, scaled up to fill the window, centered on a page in the current phase's background color. */
:root {
  --bg: #e9a23b;     /* current phase background (set from JS) */
  --ink: #3a2213;    /* current phase ink: ground, spikes, doors */
  --glow: #fbe7c0;   /* current phase highlight */
  color-scheme: light;
}
html, body { height: 100%; overscroll-behavior: none; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-sizing: border-box;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background-color .2s steps(2);
}
#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  max-width: 100%;
  outline: none;
  cursor: pointer;
  touch-action: none;   /* taps on the game never scroll the page */
}
[hidden] { display: none !important; }
/* Phones held upright: room for the corner buttons above the game and the controls below it */
body.touch {
  padding: calc(64px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px))
           calc(116px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
/* Phones held sideways: the game fills the screen and the controls float over it */
body.touch.land {
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
           env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#turn {
  margin: 12px 0 0;
  font: 700 11px/1.3 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: .08em;
  text-align: center;
  opacity: .75;
}
#pad { position: fixed; inset: 0; pointer-events: none; }
#pad > * { position: absolute; pointer-events: auto; touch-action: none; }
.key {
  display: flex; align-items: center; justify-content: center;
  box-sizing: border-box; padding: 0;
  border: 0; border-radius: 0;
  background: var(--ink);
  color: var(--glow);
  font: 700 20px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: .06em;
  opacity: .82;
}
.key.small { width: 44px; height: 44px; font-size: 16px; }
.key.on { opacity: 1; transform: translateY(2px); }
.key:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.key svg { width: 18px; height: 18px; }
#dpad { display: flex; gap: 6px; width: 160px; height: 80px;
        left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#dpad .key { flex: 1; font-size: 24px; }
#bJ { width: 108px; height: 80px;
      right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#bB { left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
#bF { left: calc(62px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
#bX { right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
/* Sideways they sit on top of the game, so let it show through, with an edge that reads on the dark ground */
body.land .key { opacity: .55; box-shadow: inset 0 0 0 2px var(--glow); }
body.land .key.on { opacity: .9; }
body.land #bF { left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(62px + env(safe-area-inset-top, 0px)); }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>

<canvas id="game" width="320" height="180" tabindex="0" aria-label="Grudge, a troll platformer. Arrow keys or WASD to move, Space to jump, R to restart, Escape for menu, M to mute, F for full screen."></canvas>
<p id="turn" hidden>TURN YOUR PHONE SIDEWAYS<br>FOR A BIGGER SCREEN</p>
<div id="pad" hidden>
  <div id="dpad" role="group" aria-label="Move. Hold an arrow, or slide your thumb between them.">
    <span class="key">&#9664;</span><span class="key">&#9654;</span>
  </div>
  <button id="bJ" class="key" aria-label="Jump, or select in menus">JUMP</button>
  <button id="bB" class="key small" aria-label="Back to the menu">&lt;</button>
  <button id="bF" class="key small" aria-label="Full screen" hidden>
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true">
      <path d="M2 7V2h5M11 2h5v5M16 11v5h-5M7 16H2v-5"/></svg>
  </button>
  <button id="bX" class="key small" aria-label="Restart the level">R</button>
</div>

<script>
'use strict';
/* =====================================================================
   GRUDGE  -  a tiny troll platformer
   "The level never forgets. Neither do you."
   20 phases x 5 levels, plus a bonus phase. Each phase has its own palette, backdrop, weather and trick.

   Sections:
     1. CONFIG        6. LEVEL LOADING   11. MENUS
     2. INPUT         7. PHYSICS         12. GAME STATES + LOOP
     3. FONT          8. TRAPS
     4. SPRITES       9. RENDERING
     5. PHASES/LEVELS 10. AUDIO
   ===================================================================== */

/* ============================ 1. CONFIG ============================ */
const W = 320, H = 180;          // native resolution
const TS = 8;                    // tile size in pixels
const COLS = 40, ROWS = 22;      // level grid (40x22 tiles = 320x176)
const OY = H - ROWS * TS;        // 4px top margin
const DT = 1 / 60;               // fixed timestep
const PH = {                     // player physics (pixels, seconds)
  run: 90, accG: 1100, accA: 800, accIdleAir: 160, fric: 1400,
  grav: 820, jump: 195, cut: 0.45, maxFall: 320,
  coyote: 0.09, buffer: 0.12,
};
const MAX_STONES = 3;            // grudge stones kept per level (oldest crumbles)
const DEAD_PAUSE = 0.7;          // seconds before auto-respawn
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SAVE_KEY = 'grudge-save-v2';

/* ============================ 2. INPUT ============================= */
// Held state for gameplay, plus one-shot "presses" for menus.
const input = { left: false, right: false, jump: false, jumpPressed: false, restartPressed: false,
                presses: new Set(), tap: null, hover: null };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
                 Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump' };
const MENUKEYS = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
                   ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
                   Space: 'ok', Enter: 'ok', KeyZ: 'ok', Escape: 'back', Backspace: 'back' };
addEventListener('keydown', e => {
  initAudio();
  const k = KEYMAP[e.code];
  if (k) { if (k === 'jump' && !input.jump) input.jumpPressed = true; input[k] = true; }
  if (MENUKEYS[e.code] || k) e.preventDefault();
  if (!e.repeat && MENUKEYS[e.code]) input.presses.add(MENUKEYS[e.code]);
  if (e.code === 'KeyR' && !e.repeat) input.restartPressed = true;
  if (e.code === 'KeyM' && !e.repeat) cycleSound();
  if (e.code === 'KeyF' && !e.repeat) toggleFullscreen();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) input[k] = false; });
addEventListener('blur', () => { input.left = input.right = input.jump = false; });

// On-screen controls for phones (they also drive the menus)
const pad = document.getElementById('pad'), turnHint = document.getElementById('turn');
const bX = document.getElementById('bX'), bF = document.getElementById('bF');
function bindButton(id, down, up) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio(); down();
    b.classList.add('on');
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
  });
  const off = () => { if (up) up(); b.classList.remove('on'); };
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindButton('bJ', () => { input.presses.add('ok'); if (!input.jump) input.jumpPressed = true; input.jump = true; },
                 () => { input.jump = false; });
bindButton('bX', () => { input.restartPressed = true; });          // only shown inside a level
bindButton('bB', () => { input.presses.add('back'); });
bindButton('bF', toggleFullscreen);

// Move strip: one control for both arrows, so a thumb can slide from one to the other without lifting
const dpad = document.getElementById('dpad'), [dL, dR] = dpad.children;
let dpadId = null, dpadDir = 0;
function dpadSet(dir) {
  if (dir && dir !== dpadDir) input.presses.add(dir < 0 ? 'left' : 'right');
  dpadDir = dir; input.left = dir < 0; input.right = dir > 0;
  dL.classList.toggle('on', dir < 0); dR.classList.toggle('on', dir > 0);
}
const dpadAim = e => { const r = dpad.getBoundingClientRect(); dpadSet(e.clientX < r.left + r.width / 2 ? -1 : 1); };
dpad.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio(); dpadId = e.pointerId;
  try { dpad.setPointerCapture(e.pointerId); } catch (_) {}
  dpadAim(e);
});
dpad.addEventListener('pointermove', e => { if (e.pointerId === dpadId) dpadAim(e); });
const dpadOff = e => { if (e.pointerId === dpadId) { dpadId = null; dpadSet(0); } };
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) dpad.addEventListener(t, dpadOff);
dpad.addEventListener('contextmenu', e => e.preventDefault());

// Full screen where the browser allows it (computers, Android); on iPhone, Add to Home Screen does the same job
const canFullscreen = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
bF.hidden = !canFullscreen;
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  if (!canFullscreen) return showToast('ON IPHONE: SHARE, THEN ADD TO HOME SCREEN');
  if (isFullscreen()) return (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (p && p.then) p.then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); },
                         () => showToast('THIS BROWSER SAID NO TO FULL SCREEN'));
}
// A short buzz on phones that can (follows the SHAKE setting)
const buzz = pattern => {
  const tapped = !navigator.userActivation || navigator.userActivation.hasBeenActive;   // browsers refuse before a tap

// Gamepad: d-pad or left stick moves, A jumps / confirms, B or Select backs out, X or Y restarts, Start confirms.
let gpPrev = {};
function pollGamepad() {
  let gp = null;
  try { gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(g => g && g.connected); } catch (_) {}
  if (!gp) return;
  const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed), ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const now = { left: b(14) || ax < -0.4, right: b(15) || ax > 0.4, up: b(12) || ay < -0.5, down: b(13) || ay > 0.5,
                jump: b(0), back: b(1) || b(8), restart: b(2) || b(3), start: b(9) };
  for (const k of ['left', 'right', 'jump']) if (now[k] !== !!gpPrev[k]) {     // only touch held keys on change
    if (k === 'jump' && now.jump && !input.jump) input.jumpPressed = true;
    input[k] = now[k];
  }
  const edge = k => now[k] && !gpPrev[k];
  for (const k of ['left', 'right', 'up', 'down', 'back']) if (edge(k)) input.presses.add(k);
  if (edge('jump') || edge('start')) input.presses.add('ok');
  if (edge('restart')) input.restartPressed = true;
  gpPrev = now;
}

const MARKS = { acute: [[2, -3], [1, -2]], grave: [[0, -3], [1, -2]], circ: [[1, -3], [0, -2], [2, -2]],
                tilde: [[1, -3], [2, -3], [0, -2], [1, -2]], uml: [[0, -2], [2, -2]], ced: [[1, 5], [0, 6]] };
const ACCENTS = {};

const upper = s => String(s).toUpperCase().normalize('NFC');
const textW = (s, sc = 1) => [...upper(s)].length * 4 * sc - sc;
function text(str, x, y, col, sc = 1, align = 'left') {
  str = upper(str);
  const w = textW(str, sc);
  if (align === 'center') x = Math.round(x - w / 2); else if (align === 'right') x = x - w;
  ctx.fillStyle = col;
  for (const ch of str) {
    const acc = ACCENTS[ch], g = FONT[acc ? acc[0] : ch];
    if (g) for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++)
      if ((g[r] >> (2 - c)) & 1) ctx.fillRect(x + c * sc, y + r * sc, sc, sc);
    if (acc) for (const [mx, my] of MARKS[acc[1]]) ctx.fillRect(x + mx * sc, y + my * sc, sc, sc);

const fitScale = (s, sc, maxW = W - 8) => { while (sc > 1 && textW(s, sc) > maxW) sc--; return sc; };

const skinUnlocked = s => !s.need || save.got.includes(s.id) || s.need.have() >= s.need.goal;   // once won, kept
const skinById = id => SKINS.find(s => s.id === id) || SKINS[0];

let SPR = {};
function bakeSprite(rows, cmap) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    g.fillStyle = cmap[ch]; g.fillRect(x, y, 1, 1);
  }));
  return c;
}
// Body pixels on the silhouette's edge become '6' (drawn in the outline color).
function edgeRows(rows) {
  const at = (x, y) => (rows[y] || '')[x] || '.';
  return rows.map((r, y) => [...r].map((ch, x) =>
    ch === '1' && [at(x - 1, y), at(x + 1, y), at(x, y - 1), at(x, y + 1)].includes('.') ? '6' : ch).join(''));
}
// One hero frame in a given skin, for the current palette (sil = solid ink silhouette for locked skins).
const skinCache = {};
function skinSprite(skin, frame, sil = false) {
  const key = skin.id + ':' + frame + ':' + palPhase + (sil ? ':sil' : '');
  if (skinCache[key]) return skinCache[key];
  let body = HERO[frame];
  if (skin.style === 'ghost') body = body.slice(0, 7).concat(frame.startsWith('run') ? '.11.11.1' : '1.11.11.');
  let rows = (skin.hat || []).concat(body);
  const lit = skin.style === 'outline' || skin.style === 'gold';
  if (lit) rows = edgeRows(rows);
  const fill = skin.style === 'gold' ? '#f2c14e' : skin.style === 'outline' ? pal.glow
             : skin.style === 'ghost' ? pal.hero + 'a8' : pal.hero;
  const cmap = sil ? { 1: pal.ink, 2: pal.ink, 4: pal.ink, 5: pal.ink, 6: pal.ink }
                   : { 1: fill, 2: lit ? pal.hero : pal.bg, 4: pal.glow, 5: skin.c5 || pal.hero, 6: pal.hero };
  return (skinCache[key] = bakeSprite(rows, cmap));
}
let uiT = null;                                   // the blends the menus use: lit edges, lips, accents
function bakeSprites() {
  SPR = {};
  uiT = groundTones();
  const sk = skinById(save.skin);
  for (const k in HERO) SPR[k] = skinSprite(sk, k);
  SPR.star = bakeSprite(STAR, { 1: pal.glow });
  SPR.stone = bakeSprite(STONE, { 1: pal.ink, 2: pal.bg });
  SPR.spike = bakeSprite(SPIKE, { 1: pal.ink });
  SPR.spikeDown = bakeSprite([...SPIKE].reverse(), { 1: pal.ink });
  SPR.plat = bakeSprite(PLAT, { 1: pal.ink, 2: groundTones().hi });   // floating platforms catch the light on top too
  groundDirty = true;
  SPR.door = bakeSprite(DOOR, { 1: pal.ink, 2: pal.glow });
  SPR.skull = bakeSprite(SKULL, { 1: pal.ink });
  SPR.lock = bakeSprite(LOCK, { 1: pal.bg });
}

/*  A PHASE = { name, tag, motif, pal:[background, backdrop, ink, hero, glow], levels:[5 levels] }

      hint, pity (after pityAt deaths) and a trap's say are the narrator's lines. The game doesn't show them
      at the moment; they stay here as notes on each level, and so the narrator can come back.

    Map tiles (rows are 40 wide; the map is centered vertically and its last row is extended
    down to the screen edge, so write only the interesting part):
      .  empty            #  ground           ^  spike (up)      v  spike (down)
      P  player start     D  exit door        F  fake door (kills)
      =  ice (slippery)   *  spring           <  >  conveyor belts (carry you left / right)
      a-z (except v)  trap group tiles, configured in `groups`:
          {}                     solid block drawn like ground (fake floor, falling ceiling...)
          {spike:1}  {down:1}    spike tile (pointing down)    {hide:1}  starts sunk out of sight
          {ghost:1}              solid but invisible until touched
          {phantom:1}            visible but NOT solid
          {plat:1} {cloud:1}     drawn as a floating platform
          {airMove:n, airMax:m}  slides right n tiles/s, only while you're airborne
          {patrol:{dx,dy,speed,wait,phase}}   moves back and forth forever (ferries, presses, lifts)
          {blink:[period, phase]}             hidden spikes that pop in and out on a rhythm
    Traps: { when:{...}, do:'action', g:'letters', say:'narrator line', delay, repeat }
      when: x (player tile x >=), xl (<=), up (tiles above spawn >=), low (tiles above spawn <=), touch:'a', stand:'a' (on top of it), jump:true,
            deaths:n, t:secs, after:trapIndex
      do:   fall | pop | move(dx,dy,speed) | chase(speed) | show | vanish | say
            door(x, dy, speed, hop: leap over you, n tiles high | blink: vanish and reappear) | flee(speed, max) | reverse(time)
            flood(speed) | gust(dir, speed, time) | gravity(k) | belts | lights(on)
    Level-wide tricks (phases 11-20):
      wrap: true                      walk off one side, come in the other (no side walls)
      wind: {speed, on, off, dir}     gusts on a clock; dir 1 / -1, or 'alt' to swap each gust
      flood: {speed, delay, top}      the water rises from below; 'trigger: true' waits for a trap
      dark: {r, flash}                only a circle of light around you; a flash every `flash` s
      echo: secs                      your own shadow walks your path that many seconds behind
      grav: k                         gravity times k (the moon)
      belt: px/s, spring: px/s        conveyor speed, spring launch speed

// Rebuild the level from its data. Stones and death counts persist between attempts.
function startAttempt() {

  const src = L.map.map(r => r.padEnd(COLS, '.').slice(0, COLS));
  const top = clamp(4 + Math.floor((ROWS - 4 - src.length) / 2), 0, Math.max(0, ROWS - src.length));
  const rows = [];
  for (let i = 0; i < top; i++) rows.push(E40);
  rows.push(...src.slice(0, ROWS - top));
  while (rows.length < ROWS) rows.push(src[src.length - 1]);
  bannerY = clamp(rows.findIndex(r => /[^.]/.test(r)) * TS + OY - 42, 34, 68);

  // 0 empty, 1 solid, 2 spike up, 3 spike down, 4 ice, 5 spring, 6 belt left, 7 belt right (4+ are all solid)
  grid = new Uint8Array(COLS * ROWS); groundDirty = true;
  groups = []; gmap = {}; fakeDoors = []; door = null; spawn = { tx: 1, ty: ROWS - 2 };
  rows.forEach((row, ty) => [...row].forEach((ch, tx) => {
    const i = ty * COLS + tx;
    if (ch === '#') grid[i] = 1;
    else if (ch === '^') grid[i] = 2;
    else if (ch === 'v') grid[i] = 3;
    else if (ch === '=') grid[i] = 4;
    else if (ch === '*') grid[i] = 5;
    else if (ch === '<') grid[i] = 6;

function getGroup(ch, def) {

      ghost: !!d.ghost, revealed: false, plat: !!(d.airMove || d.plat || d.cloud),

function newPlayer() {

/* ============================ 7. PHYSICS =========================== */
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// Every solid rectangle overlapping box b: static tiles, side walls, trap blocks, grudge stones.
function solidsIn(b) {

    if (!g.solid || g.gone) continue;
    for (const [tx, ty] of g.tiles) {

function moveX(dx) {

  const x0 = Math.floor(hb.x / TS), x1 = Math.floor((hb.x + hb.w) / TS);

  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const v = tileAt(tx, ty);
    if (v === 2 && overlap(hb, { x: tx * TS + 1, y: ty * TS + 3, w: 6, h: 5 })) return kill('spike', { tx, ty });
    if (v === 3 && overlap(hb, { x: tx * TS + 1, y: ty * TS, w: 6, h: 5 })) return kill('spike', { tx, ty });
  }
  for (const g of groups) {
    if (!g.spike || g.gone) continue;

      const x = tx * TS + g.ox, y = ty * TS + g.oy;
      const r = g.down ? { x: x + 1, y, w: 6, h: 5 } : { x: x + 1, y: y + 3, w: 6, h: 5 };

/* ======================= 7b. TRICKS (phases 11-20) ======================= */
// Everything a level's trick needs, in one object so a whole attempt can be saved and replayed (tools/solve.mjs).
let mech = { windV: 0, grav: 1, beltDir: 1, flood: null, floodSpeed: 0, gustT: 0, gustDir: 0, gustSpeed: 0, echo: null,
             dark: false, boingT: 0, boingX: 0, sig: '' };
function mechReset() {
  const f = L.flood;
  mech = {
    windV: 0, grav: L.grav || 1, beltDir: 1, gustT: 0, gustDir: 0, gustSpeed: 0, braceT: 0, braceDir: 0, boingT: 0, boingX: 0,
    flood: f ? (f.from != null ? f.from : ROWS * TS + 6) : null,            // water surface, in level pixels
    floodSpeed: f && !f.trigger ? f.speed : 0, floodDelay: f ? (f.delay || 0) : 0,
    echo: L.echo ? [] : null, dark: !!L.dark && !L.dark.lit, sig: '',

}
// Push against a gust with your feet on solid ground and you hold your ground: from the moment it's announced (unless
// you were already running that way) until a moment after it dies down. Not on ice, and not in the air: there the wind has its way.
function brace(p, mx, icy) {
  if (mx !== mech.braceDir) mech.braceT = 0;                    // let go (or turn round) and the brace is over
  if (!p.onGround || icy || !mx) return false;
  if (!L.wind && !mech.gustT && !mech.windV) return false;
  const w = windNow(levelTime), g = Math.sign(w.v || mech.windV);
  const ready = !g && w.warn && w.nextDir === -mx && (p.vx * mx < 30 || mech.braceT > 0);   // bracing for the next one (unless already running into it)
  if ((g && mx === -g) || ready) { mech.braceT = 0.25; mech.braceDir = mx; return true; }
  if (mech.braceT > 0) { mech.braceT -= DT; return true; }      // the gust just died: a moment to stand up again
  return false;
}
function mechSnap() {
  const e = mech.echo;
  let ek = '';
  if (e && e.length) for (let q = 0; q < 4; q++) { const s = e[Math.floor((e.length - 1) * q / 4)]; ek += Math.round(s[0] / 5) + ':' + Math.round(s[1] / 5) + ';'; }
  mech.sig = `${mech.flood == null ? '' : Math.round(mech.flood / 3)},${mech.beltDir},${mech.grav},${Math.round(mech.windV / 8)},${mech.gustT > 0 ? 1 : 0},${mech.braceT > 0 ? mech.braceDir : 0},${ek}`;
  return { ...mech, echo: e && e.slice() };
}
function mechRestore(m) { mech = { ...m, echo: m.echo && m.echo.slice() }; }

// The wind blows on a clock: `on` seconds of gust, `off` seconds of calm (the last half second of calm warns you).
function windNow(t) {
  if (mech.gustT > 0) return { v: mech.gustDir * mech.gustSpeed, warn: false };
  const w = L.wind;
  if (!w) return { v: 0, warn: false };
  const cyc = w.on + w.off, tt = ((t + (w.phase || 0)) % cyc + cyc) % cyc, n = Math.floor((t + (w.phase || 0)) / cyc);

const ECHO_BOX = 5;                                    // the shadow's touchy middle, a bit smaller than you

function updateMech(dt) {
  const p = player;
  if (mech.gustT > 0) mech.gustT -= dt;
  mech.windV = approach(mech.windV, windNow(levelTime).v, 260 * dt);
  if (mech.boingT > 0) mech.boingT -= dt;
  // the flood: waits, then rises; drowning is a death like any other
  if (mech.flood != null) {
    if (mech.floodDelay > 0) mech.floodDelay -= dt;
    else mech.flood = Math.max(L.flood.top != null ? L.flood.top * TS : -99, mech.flood - mech.floodSpeed * dt);
    if (p.y + p.h / 2 > mech.flood) return kill('drown');
  }
  // the echo: where you were `echo` seconds ago. Don't be there. It sets off when you do, so you can get your
  // bearings at the start (after a death there's no title card to give you that moment).
  if (mech.echo && (mech.echo.length || p.vx || !p.onGround)) {
    mech.echo.push([p.x, p.y, p.face]);
    const n = Math.round(L.echo * 60);
    while (mech.echo.length > n) mech.echo.shift();
    if (mech.echo.length >= n) {

const echoAt = () => (mech.echo && mech.echo.length >= Math.round(L.echo * 60) ? mech.echo[0] : null);

/* ============================ 8. TRAPS ============================= */
function updateGroups(dt) {
  const p = player;
  for (const g of groups) {
    if (g.gone) continue;
    const standing = p.alive && p.onGround && p.ground === g;
    const ox0 = g.ox, oy0 = g.oy;
    if (g.shake > 0) { g.shake -= dt; if (g.shake <= 0 && g.pendingFall) { g.state = 'fall'; g.vy = 0; } }

    if (g.state === 'fall') {
      g.vy = Math.min(g.vy + PH.grav * dt, 420);
      let ny = g.oy + g.vy * dt, lim = Infinity;
      for (const [tx, ty] of g.tiles) {                      // land on static ground if any
        const row = Math.floor((ty * TS + ny + TS - 0.01) / TS);
        if (row >= 0 && row < ROWS && isSolid(tileAt(tx, row))) {
          const l = row * TS - (ty * TS + TS);
          if (l >= g.oy - 0.01) lim = Math.min(lim, l);
        }
      }
      if (lim !== Infinity) {
        ny = lim; g.state = 'landed'; g.vy = 0; shake(3, 0.2); sfx.thud(); g.oy = ny; fxLand(g);
        for (const [tx, ty] of g.tiles) dust(tx * TS + 4, ty * TS + ny + TS, 1);
      }
      g.oy = ny;
      if (g.oy > H + 64) g.gone = true;
    } else if (g.state === 'move') {
      const dx = g.tox - g.ox, dy = g.toy - g.oy, d = Math.hypot(dx, dy), step = g.speed * dt;
      if (d <= step) { g.ox = g.tox; g.oy = g.toy; g.state = 'done'; }
      else { g.ox += dx / d * step; g.oy += dy / d * step; }
    } else if (g.state === 'chase') {
      const target = (p.x + p.w / 2) - g.cx0;
      g.ox += clamp(target - g.ox, -g.speed * dt, g.speed * dt);
      if (g.oy > 0) g.oy = Math.max(0, g.oy - 220 * dt);    // rise out of the ground first
    } else if (g.state === 'idle') {
      if (g.d.patrol) {                                      // back-and-forth on a fixed clock
        const P = g.d.patrol, dxT = (P.dx || 0) * TS, dyT = (P.dy || 0) * TS;
        const tr = Math.hypot(dxT, dyT) / ((P.speed || 4) * TS), w = P.wait || 0, cyc = 2 * (tr + w);
        const tt = ((levelTime + (P.phase || 0)) % cyc + cyc) % cyc;
        const f = tt < w ? 0 : tt < w + tr ? (tt - w) / tr : tt < 2 * w + tr ? 1 : 1 - (tt - 2 * w - tr) / tr;
        g.ox = dxT * f; g.oy = dyT * f;

        const [per, ph] = g.d.blink;

        g.oy = approach(g.oy, target, 140 * dt);

}

function updateDoor(dt) {
  if (!door) return;
  if (door.moving) {
    if (door.lx == null) { door.lx = door.x; door.ly = door.y; }
    const dx = door.tx - door.lx, dy = door.ty - door.ly, d = Math.hypot(dx, dy), step = door.speed * dt;
    if (d <= step) { door.lx = door.tx; door.ly = door.ty; door.moving = false; dust(door.tx + 4, door.ty + 16, 3); }
    else { door.lx += dx / d * step; door.ly += dy / d * step; if (!door.hop && Math.random() < 0.5) dust(door.lx + 4, door.ly + 16, 1); }
    // a leap rises fast and comes down at the far end, so it clears you even when it starts right next to you
    const u = door.dist ? clamp(1 - Math.hypot(door.tx - door.lx, door.ty - door.ly) / door.dist, 0, 1) : 1;
    door.x = door.lx; door.y = door.ly - (door.moving && door.hop ? door.hop * TS * Math.pow(Math.sin(Math.PI * u), 0.4) : 0);

    const dist = door.x + 4 - (player.x + player.w / 2);
    if (dist > -4 && dist < 44 && door.x < door.flee.max) {
      door.x = Math.min(door.flee.max, door.x + door.flee.speed * dt);
      if (Math.random() < 0.3) dust(door.x + 4, door.y + 16, 1);

  }
}

function cond(w) {
  const pcx = (player.x + player.w / 2) / TS;
  if (w.x != null && pcx < w.x) return false;
  if (w.xl != null && pcx > w.xl) return false;
  if (w.up != null && spawn.ty - Math.floor((player.y + player.h / 2) / TS) < w.up) return false;
  if (w.low != null && spawn.ty - Math.floor((player.y + player.h / 2) / TS) > w.low) return false;
  if (w.touch && !touched.has(w.touch)) return false;
  if (w.stand && !(player.onGround && player.ground && player.ground.id === w.stand)) return false;
  if (w.jump && !jumped) return false;
  if (w.deaths != null && levelDeaths < w.deaths) return false;
  if (w.t != null && levelTime < w.t) return false;
  if (w.after != null && !(traps[w.after] && traps[w.after].done)) return false;
  if (w.zone) {                                              // player inside the tile box [x0, y0, x1, y1]
    const pcy = (player.y + player.h / 2) / TS, [x0, y0, x1, y1] = w.zone;
    if (pcx < x0 || pcx > x1 + 1 || pcy < y0 || pcy > y1 + 1) return false;
  }

    const pcy = (player.y + player.h / 2) / TS;

// The level holds a grudge: the last spot you jumped from (on plain ground) gets a hidden spike next time.
function pickGrudgeSpot() {
  for (let i = jumpsThisTry.length - 1; i >= 0; i--) {
    const { tx, ty } = jumpsThisTry[i];
    if (tileAt(tx, ty) !== 0 || tileAt(tx, ty + 1) !== 1) continue;
    if (Math.abs(tx - spawn.tx) <= 3 && Math.abs(ty - spawn.ty) <= 1) continue;
    if (door && Math.abs(tx * TS - door.x) < TS * 2) continue;
    if (stones.some(s => s.tx === tx && s.ty === ty)) continue;
    return { tx, ty };
  }

function updateTraps(dt) {

    if (t.done) continue;
    if (!t.armed && cond(t.when || {})) { t.armed = true; t.timer = t.delay || 0; }
    if (t.armed && (t.timer -= dt) <= 0) { fire(t); t.armed = false; if (!t.repeat) t.done = true; }
  }
}

function fire(t) {

    case 'fall':
      gs.forEach(g => { if (t.shake) { g.shake = t.shake; g.pendingFall = true; } else { g.state = 'fall'; g.vy = 0; } });
      sfx.trap(); break;
    case 'pop':
      gs.forEach(g => { g.state = 'move'; g.tox = g.ox; g.toy = 0; g.speed = 220; }); sfx.pop(); break;
    case 'move':
      gs.forEach(g => { g.state = 'move'; g.tox = (t.dx || 0) * TS; g.toy = (t.dy || 0) * TS; g.speed = (t.speed || 6) * TS; });
      sfx.trap(); break;
    case 'chase':
      gs.forEach(g => { g.state = 'chase'; g.speed = (t.speed || 7) * TS; }); sfx.trap(); break;
    case 'show':
      gs.forEach(g => g.revealed = true); if (!quiet) sfx.reveal(); break;
    case 'vanish':

/* ---- death, grudge stones, juice ---- */
function kill(cause, tile) {

  p.alive = false; deaths++; levelDeaths++;

  state = 'dead'; deadT = 0;
  shake(cause === 'restart' ? 2 : 6, 0.3);
  if (cause !== 'restart') { hitStop = 0.07; flashT = save.shake && !REDUCED ? 0.07 : 0; }
  skullT = 0.35;
  if (!fxDeath(p.x + p.w / 2, p.y + p.h / 2)) {
    burst(p.x + p.w / 2, p.y + p.h / 2, pal.hero, 26, 150, 0.9);
    burst(p.x + p.w / 2, p.y + p.h / 2, pal.glow, 6, 90, 0.6);
  }

  runs.push({ p: rec, dead: true }); if (runs.length > 40) runs.shift();
  if (cause !== 'pit' && cause !== 'crush' && cause !== 'restart' && cause !== 'drown' && cause !== 'echo') placeStone(tile);

  sameSpot = same ? sameSpot + 1 : 1; lastDeathTile = here;

// The signature twist: you leave a solid tombstone where you died. Max 3 per level.
function placeStone(tile) {
  const p = player;
  const t = tile || { tx: Math.floor((p.x + p.w / 2) / TS), ty: Math.floor((p.y + p.h / 2) / TS) };
  if (t.tx < 0 || t.tx >= COLS || t.ty < 0 || t.ty >= ROWS) return;
  if (isSolid(tileAt(t.tx, t.ty))) return;
  if (t.tx === spawn.tx && t.ty === spawn.ty) return;
  if (stones.some(s => s.tx === t.tx && s.ty === t.ty)) return;
  stones.push({ tx: t.tx, ty: t.ty, born: time });
  fxStone(t.tx, t.ty, false);
  if (stones.length > MAX_STONES) {
    const old = stones.shift();
    if (!fxStone(old.tx, old.ty, true)) burst(old.tx * TS + 4, old.ty * TS + 4, pal.ink, 10, 70, 0.7);
  }

}

    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, g: 420,

  for (const q of particles) { q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);

/* =========================== 9. RENDERING ========================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const pad2 = n => String(n).padStart(2, '0');
let hits = [];                    // clickable regions registered by the last rendered frame
const hit = (x, y, w, h, id) => hits.push({ x, y, w, h, id });

// Fit the canvas into whatever the body's padding leaves free (that padding makes room for phone controls).
function resize() {
  const touch = !pad.hidden, land = innerWidth > innerHeight;
  document.body.classList.toggle('touch', touch);
  document.body.classList.toggle('land', touch && land);
  turnHint.hidden = !touch || land;
  const cs = getComputedStyle(document.body), px = k => parseFloat(cs[k]) || 0;
  const aw = innerWidth - px('paddingLeft') - px('paddingRight');
  const ah = innerHeight - px('paddingTop') - px('paddingBottom') - (turnHint.hidden ? 0 : turnHint.offsetHeight + 12);
  let s = Math.min(Math.max(160, aw) / W, Math.max(90, ah) / H);   // as big as the window allows
  if (s >= 2 && s - Math.floor(s) < 0.05 * s) s = Math.floor(s);   // a whole-number size when it costs almost nothing
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', resize);

function drawSprite(img, x, y, flip = false, w = img.width, h = img.height) {
  x = Math.round(x); y = Math.round(y);
  if (!flip) return ctx.drawImage(img, x, y, w, h);
  ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, w, h); ctx.restore();
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) {                         // aliasing-free pixel circle
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1); }
}
function tri(cx, baseY, h, half, c) {                 // flat pixel triangle
  ctx.fillStyle = c;
  for (let r = 0; r < h; r++) { const w = Math.round(half * (r + 1) / h); ctx.fillRect(Math.round(cx - w), Math.round(baseY - h + r), w * 2, 1); }

/* ===================== 9b. PIXEL FX (pixelfx) ====================== */

const PFX = window.PFX || null;

// What the sky does in each phase. ramp 'light' keeps an effect to the phase's three lightest colors, so on the
// bright phases it reads as backdrop; 'full' lets the dark phases glow. over: drawn above the darkness (fireflies).
const WEATHER = {
  'THE LOBBY': { fx: 'godRays', ramp: 'light', light: 0.35 },
  'SHY GARDEN': { fx: 'cherryBlossoms', ramp: 'light', light: 0.2 },
  'RUNAWAY ROW': { fx: 'rain', ramp: 'light', light: 0.15, opts: { density: 0.35 } },
  'THE CELLAR': { fx: 'fog', ramp: 'light', light: 0.15 },
  'BONEYARD': { fx: 'fireflies', ramp: 'light', light: 0.4 },
  'MIRAGE': { haze: true },
  'MIRROR HALL': { glints: true },
  'SKY NURSERY': { fx: 'clouds', ramp: 'light', light: 0.2 },
  'THE CHASE': { fx: 'blizzard', ramp: 'light', light: 0.1 },
  'THE HEART': { fx: 'aurora', ramp: 'full', light: 0.55 },
  'THE LOOP': { fx: 'clouds', ramp: 'light', light: 0.2 },
  'FROSTBITE': { fx: 'snow', ramp: 'light', light: 0.35 },
  'THE GALE': { fx: 'fallingLeaves', ramp: 'full', light: 0.15 },
  'THE FLOOD': { fx: 'rain', ramp: 'light', light: 0.2, opts: { density: 1 } },
  'LIGHTS OUT': { fx: 'fireflies', ramp: 'full', light: 0.9, over: true },
  'THE ECHO': { fx: 'fog', ramp: 'light', light: 0.2 },
  'BOUNCE HOUSE': { fx: 'cherryBlossoms', ramp: 'light', light: 0.2 },
  'THE FACTORY': { fx: 'godRays', ramp: 'light', light: 0.3 },
  'THE MOON': { fx: 'shootingStars', ramp: 'full', light: 0.8 },
  'THE END': { fx: 'storm', ramp: 'full', light: 0.7 },

const luma = c => { const n = parseInt(c.slice(1), 16); return (n >> 16) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11; };

function phaseRamp(pi, kind) {

const darkPhase = pi => luma(PHASES[pi].pal[0]) < 90;

const fx = { phase: -1, weather: null, wt: 0, back: null, front: null, top: null, canvas: null, cx: null, img: null,
             bursts: [], glints: [], trans: null };
PHASES.forEach(ph => { ph.weather = WEATHER[ph.name] || null; });
function fxFrames() {

  fx.canvas = document.createElement('canvas'); fx.canvas.width = W; fx.canvas.height = H;

}
function fxWeather(pi) {

  const w = PHASES[pi].weather;

  const ramp = phaseRamp(pi, w.ramp), full = phaseRamp(pi, 'full');
  const o = { x: 160, y: 170, seed: 3 + pi, palette: ramp, light: w.light, ...(w.opts || {}) };
  for (const k of ['grass', 'upper', 'reds', 'golds', 'sky', 'bolt']) o[k] = k === 'reds' || k === 'bolt' ? full : ramp;

}

function fxUpdate(dt) {
  if (!fxOn()) return;
  if (fx.weather) fx.weather.update(dt);
  for (const b of fx.bursts) { b.ps.update(dt); b.bits.update(dt); b.t += dt; }
  fx.bursts = fx.bursts.filter(b => b.t < 2.5);
  for (const g of fx.glints) g.t += dt;
  fx.glints = fx.glints.filter(g => g.t < 0.45);
  const t = fx.trans;
  if (t) {
    t.fx.update(dt * t.k); t.t += dt * t.k;
    if (!t.fired && t.t >= 0.99) { t.fired = true; t.onShut(); }
    if (t.fx.done()) fx.trans = null;
  }
}

// Behind the level: the weather (and Mirror Hall's glints)
function fxDrawBack(over) {
  if (!fxOn()) return;
  const w = PHASES[L.phase].weather || {};
  if (!!w.over !== over) return;
  if (fx.phase !== L.phase) fxWeather(L.phase);
  if (!fx.weather && !w.glints) return;                  // nothing to draw: skip the whole pass (phones thank you)
  fxFrames();
  PFX.clearFrame(fx.back);
  if (fx.weather) fx.weather.draw(fx.back);
  if (w.glints) {
    if (Math.random() < 0.08) fx.glints.push({ x: 27 + (Math.random() * 6 | 0) * 54, y: 46 + Math.random() * 110, t: 0 });
    const p = PFX.painterFor(fx.back).place(0, 0);
    for (const g of fx.glints) PFX.sparkle(p, g.x, g.y, 6 * Math.sin(Math.PI * g.t / 0.45), PFX.hex(pal.glow), PFX.hex(pal.bg), 0.6);

// In front: debris and dust from deaths, stones and falling floors, in level space (so they shake with it)
function fxDrawFront(sx, sy) {

  fxFrames();
  PFX.clearFrame(fx.front);
  const p = PFX.painterFor(fx.front);
  for (const b of fx.bursts) { p.place(sx, OY + sy); p.fade = 1; p.lightK = 1; b.bits.draw(p); b.ps.draw(p, 'back'); b.ps.draw(p, 'front'); }

// The ground under a point, in level pixels: debris lands on the real platforms, not on one flat floor
function floorBelow(y0) {
  return x => {
    const tx = Math.floor(x / TS);
    for (let ty = Math.max(0, Math.floor(y0 / TS)); ty < ROWS; ty++) {
      if (isSolid(tileAt(tx, ty)) || stones.some(s => s.tx === tx && s.ty === ty)) return ty * TS;
    }
    return Infinity;

}
function fxBurst(x, y) {
  const ground = floorBelow(y), rng = new PFX.Rng((x * 7 + y * 13 + time * 1000) | 0);

const fxRamp = () => byLight([pal.ink, pal.hero, pal.deco, pal.bg, pal.glow]);
// You: sparks, and bits of you that bounce down and settle on whatever is below
function fxDeath(x, y) {

  for (let i = 0; i < 10; i++) b.bits.add({ kind: PFX.B.CHUNK, x: x + R.range(-2, 2), y: y + R.range(-2, 2), vx: R.range(-70, 70), vy: R.range(-150, -50), a: R.range(0, 6), va: R.range(-12, 12), s: R.range(0.8, 1.6), ramp: [pal.ink, pal.hero, pal.hero, pal.glow], g: 0.5, bounce: 0.4, drag: 0.4, life: R.range(1.2, 2.2) });
  for (let i = 0; i < 4; i++) b.ps.spawn(P.DUST, x + R.range(-3, 3), y + 2, R.range(-30, 30), R.range(-20, -5), R.range(0.4, 0.8), PFX.hex(pal.deco), R.range(1.5, 2.5));

// A grudge stone slams down: a ring of dust. The oldest crumbles: chunks of it tumble away.
function fxStone(tx, ty, crumble) {

  if (crumble) {
    for (let i = 0; i < 9; i++) b.bits.add({ kind: PFX.B.CHUNK, x: x + R.range(-3, 3), y: y - R.range(1, 7), vx: R.range(-60, 60), vy: R.range(-120, -30), a: R.range(0, 6), va: R.range(-10, 10), s: R.range(1, 2), ramp: [pal.ink, pal.ink, pal.deco, pal.bg], g: 0.55, bounce: 0.35, drag: 0.3, life: R.range(1.4, 2.3) });

// The way out: an iris closes on the door (a star when a phase is done), and opens again on whatever comes next.
function fxExit(onShut) {

// Each phase gets one flat backdrop motif drawn in its fifth color, behind everything.
function drawBackdrop(motif, t) {
  const c = pal.deco, R = rng(7);
  switch (motif) {
    case 'sun':
      disc(252, 46, 22, c);
      for (const [x, r] of [[30, 46], [130, 60], [236, 50], [330, 44]]) disc(x, 168, r, c);
      break;
    case 'garden':
      for (let i = 0; i < 15; i++) {
        const x = 8 + i * 22 + Math.floor(R() * 8), h = 40 + Math.floor(R() * 60);
        const sway = Math.round(Math.sin(t * 1.2 + i) * 1);
        rect(x, 180 - h, 2, h, c); disc(x + 1 + sway, 180 - h, 4 + Math.floor(R() * 3), c);
      }
      break;
    case 'city':
      for (let x = -6; x < W; ) {
        const w = 16 + Math.floor(R() * 18), h = 50 + Math.floor(R() * 70);
        rect(x, 180 - h, w, h, c);
        for (let wy = 180 - h + 6; wy < 176; wy += 8) for (let wx = x + 4; wx < x + w - 4; wx += 6)
          if (R() < 0.55) rect(wx, wy, 2, 3, pal.bg);
        x += w + 4;
      }
      break;

      for (let i = 0; i < 6; i++) {
        const x = i * 64 - 10;
        rect(x, 0, 64, 40, c); disc(x + 37, 40, 22, pal.bg); rect(x + 15, 40, 45, 140, pal.bg);
        rect(x, 0, 12, 180, c);
      }
      break;
    case 'graves':
      disc(56, 40, 14, c); disc(62, 35, 12, pal.bg);
      for (let i = 0; i < 12; i++) {
        const x = 10 + i * 27 + Math.floor(R() * 8), h = 12 + Math.floor(R() * 10), w = 10 + Math.floor(R() * 4);
        const y = 110 + Math.floor(R() * 20);
        rect(x, y - h, w, h + 80, c); disc(x + w / 2, y - h, w / 2, c);
        if (R() < 0.5) { rect(x + w / 2 - 1, y - h - 2, 2, 7, pal.bg); rect(x + w / 2 - 3, y - h, 6, 2, pal.bg); }
      }
      break;
    case 'dunes':
      disc(232, 50, 18, c);
      tri(70, 150, 56, 64, c); tri(150, 150, 76, 84, c); tri(250, 150, 44, 52, c);
      rect(0, 150, W, 30, c);
      break;
    case 'mirrors':
      for (let i = 0; i < 6; i++) {
        const x = 14 + i * 54;
        disc(x + 13, 40, 13, c); rect(x, 40, 27, 140, c);
        disc(x + 13, 42, 9, pal.bg); rect(x + 4, 42, 19, 138, pal.bg);
        const gy = 60 + ((i * 37 + Math.floor(t * 20)) % 100);
        rect(x + 8, gy, 2, 10, c);
      }
      break;
    case 'clouds':
      for (let i = 0; i < 6; i++) {
        const x = ((i * 71 + t * (4 + i)) % 400) - 40, y = 24 + (i * 37) % 90;
        disc(x, y, 9, c); disc(x + 12, y - 5, 12, c); disc(x + 26, y, 9, c); rect(x, y, 26, 9, c);
      }
      break;
    case 'peaks':
      tri(50, 180, 110, 90, c); tri(170, 180, 140, 110, c); tri(290, 180, 100, 80, c);
      for (let i = 0; i < 9; i++) {
        const x = W - ((i * 53 + t * (90 + i * 10)) % (W + 40)), y = 30 + i * 13;
        rect(x, y, 14 + (i % 3) * 6, 1, c);
      }
      break;
    case 'eyes': {                                    // they watch you, and blink now and then
      const live = player && (state === 'play' || state === 'dead' || state === 'exit');
      const lx = live ? player.x + 3 : W / 2, ly = live ? player.y + OY : 100;
      for (const [ex, ey, r] of [[38, 42, 12], [118, 28, 9], [196, 50, 14], [282, 30, 10], [78, 124, 10], [252, 120, 12]]) {
        if (((t * 0.6 + ex * 0.011) % 4) < 0.14) { rect(ex - r, ey, r * 2 + 1, 2, c); continue; }
        disc(ex, ey, r, c);

      }

    }

      for (let k = 0; k < 3; k++) {

        for (let a = 0; a < Math.PI * 2; a += 0.04) {

      for (let i = 0; i < 13; i++) {

        for (let k = 0; k < 3; k++) tri(x, y - k * (h / 4), Math.round(h / 2), Math.round(h / 4) - k * 2, c);

        }
      }
      break;
    case 'waves':
      disc(250, 40, 16, c);
      for (let row = 0; row < 4; row++) for (let x = 0; x < W; x += 2) {
        const y = 108 + row * 18 + Math.round(Math.sin(x * 0.05 + t * (1.2 + row * 0.4) + row) * (3 + row));
        rect(x, y, 2, 180 - y, row % 2 ? c : pal.bg);

      break;
    case 'lamps':

        rect(x, 70, 2, 110, c); rect(x - 6 + sw, 66, 14, 2, c); rect(x - 4 + sw, 60, 10, 6, c);
      }
      break;
    case 'ripples':
      for (const [x, y, off] of [[70, 60, 0], [240, 90, 1.3], [150, 140, 2.6]])
        for (let k = 0; k < 4; k++) {
          const r = ((t * 14 + off * 20 + k * 22) % 88) + 4;
          for (let a = 0; a < Math.PI * 2; a += 0.05) rect(Math.round(x + Math.cos(a) * r * 1.6), Math.round(y + Math.sin(a) * r * 0.55), 2, 1, c);
        }
      break;
    case 'balloons':
      for (let i = 0; i < 9; i++) {

        disc(x, y, 7 + (i % 3), c); tri(x, y + 12, 4, 2, c);

      }
      break;
    case 'gears':

        disc(x, y, r, c); disc(x, y, Math.round(r * 0.35), pal.bg);
        for (let k = 0; k < 10; k++) { const a = t * sp + k * Math.PI / 5; rect(Math.round(x + Math.cos(a) * (r + 2)) - 3, Math.round(y + Math.sin(a) * (r + 2)) - 3, 6, 6, c); }
      }

    case 'planet':
      for (let i = 0; i < 50; i++) { const x = R() * W, y = R() * 120; if (((t * 1.5 + i) | 0) % 7) rect(x, y, 1, 1, c); }
      disc(250, 46, 13, c); disc(245, 43, 4, pal.bg); disc(254, 50, 3, pal.bg);
      disc(160, 410, 280, c);
      for (const [x, y, r] of [[60, 150, 8], [140, 140, 5], [210, 152, 10], [280, 160, 6]]) disc(x, y, r, pal.bg);
      break;
    case 'bigdoor':                                   // the real last door, waiting in the dark
      for (let i = 0; i < 40; i++) { const x = R() * W, y = R() * 170; if (((t * 2 + i) | 0) % 6) rect(x, y, 1, 1, c); }
      rect(118, 22, 84, 158, c); rect(126, 30, 68, 150, pal.bg); rect(132, 36, 56, 144, c);

      const r = 22 + ((t * 1.6 | 0) % 2);

}

function render() {
  hits = [];
  const inLevel = state === 'play' || state === 'dead';
  if (bX.hidden === inLevel) bX.hidden = !inLevel;     // the phone R button only makes sense in a level
  ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, W, H);
  if (state === 'title') drawHome();
  else if (state === 'phases') drawPhases();
  else if (state === 'levels') drawLevels();
  else if (state === 'card') drawPhaseCard();
  else if (state === 'ending') drawEnding();
  else if (state === 'fakeout') drawFakeout();
  else if (state === 'skins') drawSkins();
  else drawGame();
  if (flashT > 0) { ctx.globalAlpha = 0.45; ctx.fillStyle = pal.glow; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawToast();
  drawFade();
  drawTransition();
}

function drawGame() {
  drawBackdrop(PHASES[L.phase].motif, time);
  if ((PHASES[L.phase].weather || {}).haze && !REDUCED)              // MIRAGE: the air above the dunes wobbles
    for (let y = 70; y < H; y += 2) { const dx = Math.round(Math.sin(y * 0.31 + time * 5) * (y - 60) / 60); if (dx) ctx.drawImage(cv, 0, y, W, 2, dx, y, W, 2); }
  fxDrawBack(false);
  let sx = 0, sy = 0;
  if (shakeT > 0) {
    const m = shakeMag * Math.min(1, shakeT / 0.2);
    sx = Math.round((Math.random() * 2 - 1) * m); sy = Math.round((Math.random() * 2 - 1) * m);
  }
  ctx.save(); ctx.translate(sx, OY + sy);

  // Trap groups first, so hidden spikes tuck behind the ground drawn over them
  if (groundDirty || !groundCv) buildGround();
  for (const g of groups) {
    if (g.gone) continue;

function drawTrickTile(v, tx, ty) {

// Your own shadow, a few seconds behind you.
function drawEcho() {
  const e = echoAt();
  if (!e || state === 'replay') return;
  ctx.globalAlpha = 0.55 + 0.2 * Math.sin(time * 9);
  const img = SPR.idle0;
  drawSprite(img, e[0] - 1, e[1] + 7 - img.height, e[2] < 0);
  ctx.globalAlpha = 1;
  if (L.wrap && (e[0] < 8 || e[0] > W - 16)) drawSprite(img, e[0] - 1 + (e[0] < 8 ? W : -W), e[1] + 7 - img.height, e[2] < 0);

// The rising water: a band in the phase's hero color with a lit, rolling top.
function drawFlood() {

  const top = Math.round(mech.flood);
  ctx.globalAlpha = 0.34;                                  // see-through, so you can still see what's under it
  rect(0, top + 1, W, ROWS * TS - top + 8, pal.glow);
  ctx.globalAlpha = 0.25;
  rect(0, top + 3, W, 1, pal.ink);
  ctx.globalAlpha = 1;

// Gusts: streaks racing across, and a warning just before one hits.
function drawWind() {

  for (let i = 0; i < 18; i++) {

    ctx.fillRect(Math.round(x), y, Math.max(2, Math.round(Math.abs(v) / 6)), 1);

// Lights out: darkness everywhere but a circle round you (and a dim glow at the door). A flash now and then.
let darkC = null, darkCtx = null, darkImg = null;
function drawDark() {

function drawPlayer() {

function drawReplay() {

    const len = r.p.length / 3;
    if (!len) return;
    const i = Math.min(idx, len - 1), x = r.p[i * 3], y = r.p[i * 3 + 1];
    if (idx >= len) { if (r.dead) ctx.drawImage(SPR.skull, x, y + 2); return; }
    const px = i ? r.p[i * 3 - 3] : x, py = i ? r.p[i * 3 - 2] : y;
    const fr = y < py ? 'jump' : y > py ? 'fall' : x !== px ? RUN_CYCLE[(i >> 1) % 4] : 'idle0';
    ctx.globalAlpha = n === runs.length - 1 ? 1 : 0.45;

  homeSel = Math.min(homeSel, items.length - 1);          // the two menus have different lengths
  if (input.presses.has('up') || input.presses.has('left')) { homeSel = (homeSel + items.length - 1) % items.length; sfx.move(); }
  if (input.presses.has('down') || input.presses.has('right')) { homeSel = (homeSel + 1) % items.length; sfx.move(); }
  let pick = input.presses.has('ok') ? homeSel : null;
  const tap = hitAt(input.tap);
  if (tap && tap.startsWith('home:')) pick = +tap.slice(5);
  if (!homeOpts || items[homeSel].id !== 'reset' || (pick != null && items[pick] && items[pick].id !== 'reset')) resetArm = false;
  if (pick == null || !items[pick]) return;
  const id = items[pick].id;
  if (id === 'sound') { cycleSound(); sfx.ok(); return; }
  if (id === 'shake') { save.shake = !save.shake; writeSave(); sfx.ok(); shake(3, 0.2); return; }
  if (id === 'full') { toggleFullscreen(); sfx.ok(); return; }
  if (id === 'lang') {                                   // cycle through the languages
    const k = LANGS.findIndex(l => l[0] === lang);
    setLang(LANGS[(k + 1) % LANGS.length][0]); save.lang = lang; writeSave(); sfx.ok(); return;
  }
  if (id === 'reset') {
    if (!resetArm) { resetArm = true; sfx.nope(); shake(2, 0.15); return; }      // one more press to be sure
    resetArm = false; resetProgress(); sfx.die(); shake(5, 0.35);
    showToast('PROGRESS ERASED.'); homeOpts = false; homeSel = 0; setPalette(themePhase()); return;
  }
  if (id === 'options') { homeOpts = true; homeSel = 0; sfx.ok(); return; }
  if (id === 'back') { homeOpts = false; homeSel = 3; resetArm = false; sfx.back(); return; }
  sfx.ok();
  if (id === 'play') { const i = firstOpenLevel(); fadeTo(() => i < 0 ? goPhases(0) : playFrom(i)); }
  else if (id === 'skins') fadeTo(goSkins);
  else fadeTo(() => goPhases());
}

/* ===================== 12. GAME STATES + LOOP ====================== */
function fadeTo(cb) { if (fade.dir > 0) return; fade.dir = 1; fade.cb = cb; }

function update(dt) {
  time += dt;
  if (toastT > 0) toastT -= dt;
  if (flashT > 0) flashT -= dt;
  if (skullT > 0) skullT -= dt;
  updateMusic();
  if (hitStop > 0) {                                  // freeze a few frames when you die
    hitStop -= dt;
    input.jumpPressed = input.restartPressed = false; input.presses.clear(); input.tap = null;
    return;
  }
  if (fade.dir) {
    fade.a += fade.dir * dt / 0.22;
    if (fade.dir > 0 && fade.a >= 1) { fade.a = 1; fade.dir = -1; const cb = fade.cb; fade.cb = null; if (cb) cb(); }
    else if (fade.dir < 0 && fade.a <= 0) { fade.a = 0; fade.dir = 0; }
  }
  if (shakeT > 0) shakeT -= dt;
  updateParticles(dt);
  fxUpdate(dt);
  if (fade.dir <= 0) {
    const inLevel = state === 'play' || state === 'dead';
    if (inLevel && (input.presses.has('back') || (input.tap && hitAt(input.tap) === 'menu'))) {
      sfx.back();
      const p = L.phase, k = L.num; fadeTo(() => goLevels(p, k));
    } else switch (state) {
      case 'title': updateHome(dt); break;
      case 'phases': updatePhases(dt); break;
      case 'levels': updateLevels(dt); break;
      case 'skins': updateSkins(dt); break;
      case 'card':
        cardT += dt;
        if (cardT > 2.4 || (cardT > 0.3 && (input.presses.has('ok') || input.jumpPressed || input.tap))) { const i = cardLevel; cardT = -99; fadeTo(() => loadLevel(i)); }
        break;
      case 'play': save.playT += dt; updatePlay(dt); break;
      case 'dead':
        save.playT += dt; deadT += dt; updateGroups(dt);
        if (deadT > DEAD_PAUSE || (deadT > 0.15 && (input.jumpPressed || input.restartPressed))) startAttempt();
        break;
      case 'exit':
        exitT += dt;
        if (!fx.trans && exitT > 0.45 && !exitDone) {
          exitDone = true;
          recordClear();
          if (runs.length >= 3) startReplay(); else leaveLevel();
        }
        break;
      case 'replay':
        replayT += dt; updateReplay();
        if (replayT > replayDur || (replayT > 0.4 && (input.jumpPressed || input.presses.has('ok') || input.presses.has('back') || input.tap)))
          leaveLevel();
        break;
      case 'fakeout':
        fakeT += dt;
        if (fakeT > 3.4 && (input.jumpPressed || input.presses.has('ok') || input.tap)) { fakeT = -99; fadeTo(() => goCard(MAIN_PHASES / 2 * 5)); }
        break;
      case 'ending':
        endT += dt;
        if (endT > 0.8 && (input.jumpPressed || input.presses.has('ok') || input.tap)) fadeTo(goHome);
        break;
    }
  }
  input.jumpPressed = input.restartPressed = false;
  input.presses.clear(); input.tap = null;
}

function recordClear() {
  runs.push({ p: rec, dead: false });
  save.cleared[li] = true;
  const b = save.best[li] || (save.best[li] = {});
  b.d = b.d == null ? levelDeaths : Math.min(b.d, levelDeaths);
  b.t = b.t == null ? levelTime : Math.min(b.t, levelTime);
  checkUnlocks(); writeSave();
}
function startReplay() {
  const longest = Math.max(...runs.map(r => r.p.length / 3)) / 30;   // seconds
  replaySpeed = Math.max(1, longest / 5);                           // never longer than ~5s
  replayDur = longest / replaySpeed + 1;
  replayT = 0; state = 'replay';
}
function leaveLevel(covered) {                       // covered: an iris already hides the screen, no fade needed
  const go = cb => (covered ? cb() : fadeTo(cb));
  const next = li + 1;
  go(() => {
    if (li === MAIN_LEVELS - 1 || next >= LEVELS.length) {
      state = 'ending'; endT = 0; endBonus = li >= MAIN_LEVELS; setPalette(endBonus ? PHASES.length - 1 : MAIN_PHASES - 1);
    }
    else if (next === MAIN_PHASES / 2 * 5 && !save.fakeoutSeen) {   // finishing THE HEART for the first time
      save.fakeoutSeen = true; writeSave(); state = 'fakeout'; fakeT = 0; setPalette(L.phase);
    }
    else if (LEVELS[next].phase !== L.phase) goCard(next);
    else loadLevel(next);
  });
}

function updatePlay(dt) {
  // First visit: the level waits behind its title until you move
  if (introT > 0 && levelDeaths === 0) {
    if (input.left || input.right || input.jumpPressed) introT = 0;
    else { introT -= dt; if (introT > 0) return; }
  }
  levelTime += dt;
  if (msgT > 0) msgT -= dt;
  if (reverseT > 0) reverseT -= dt;
  if (input.restartPressed) return kill('restart');
  touched.clear(); jumped = false;
  updatePlayer(dt);
  if ((recTick++ & 1) === 0 && rec.length < 3000)     // 30 samples/s of x, y, facing for the replay
    rec.push(Math.round(player.x), Math.round(player.y), player.face < 0 ? 1 : 0);
  updateGroups(dt);
  updateDoor(dt);
  if (!player.alive) return;
  updateMech(dt);
  if (!player.alive) return;
  checkHazards();
  if (!player.alive) return;
  updateTraps(dt);
  if (player.y > ROWS * TS + 16) return kill('pit');
  if (door && !(door.moving && door.hop) && overlap(player, { x: door.x + 2, y: door.y + 6, w: 4, h: 10 })) {
    state = 'exit'; exitT = 0; exitDone = false; sfx.win(); buzz([15, 50, 15]);
    burst(door.x + 4, door.y + 8, pal.glow, 14, 80, 0.6);
    fxExit(() => { exitDone = true; recordClear(); if (runs.length >= 3) startReplay(); else leaveLevel(true); });
  }
}

function canvasPos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  initAudio(); cv.focus(); input.tap = canvasPos(e); input.hover = input.tap;
});
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') input.hover = canvasPos(e); });
cv.addEventListener('pointerleave', () => { input.hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  pollGamepad();
  acc += dt;
  while (acc >= DT) { update(DT); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}

// Level links (#L=...) came from the level editor, which is taking a break: tidy the address and say so
function dropLevelLink() {
  if (!location.hash.startsWith('#L=')) return;
  try { history.replaceState(null, '', location.href.split('#')[0]); } catch (_) {}
  showToast('LEVEL LINKS ARE COMING BACK LATER.');
}

// Keep progress across live page updates when the viewer supports it
window.claude?.hot?.snapshot?.(() => ({ li, playing: state === 'play' || state === 'dead' }));
function start(data) {
  loadSave();
  setLang(save.lang || browserLang());
  deaths = save.deaths || 0; muted = save.sound === 0;
  checkUnlocks(true);
  addEventListener('visibilitychange', () => { if (document.hidden) writeSave(); });   // keep play time
  addEventListener('hashchange', dropLevelLink);
  if (data && data.playing && typeof data.li === 'number' && LEVELS[data.li]) loadLevel(data.li);
  else goHome();
  dropLevelLink();
  resize();
  cv.focus();
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
