  drawSprite(img, W / 2 - img.width * 1.5, 78 - img.height * 3 - hop, false, img.width * 3, img.height * 3);
  SKINS.forEach((sk, i) => {
    const x = 20 + (i % 6) * 48, y = 86 + Math.floor(i / 6) * 40, sel = i === skinSel, yy = y - (sel ? 2 : 0);
    const on = skinUnlocked(sk);
    if (sel) rect(x + 2, yy + 2, 40, 34, pal.hero);
    rect(x, yy, 40, 34, pal.ink);
    rect(x + 2, yy + 2, 36, 30, on ? (sk.id === save.skin ? pal.glow : pal.bg) : pal.ink);
    if (on) { const im = skinSprite(sk, 'idle0'); drawSprite(im, x + 20 - im.width, yy + 30 - im.height * 2, false, im.width * 2, im.height * 2); }
    else ctx.drawImage(bakeLock(pal.bg), x + 15, yy + 10, 10, 14);
    hit(x, y, 40, 34, 'sk:' + i);
  });
  text(s.name + (worn ? '  - WEARING' : ''), W / 2, 166, pal.ink, 1, 'center');
  const info = open ? (worn ? 'LOOKING GOOD.' : 'PRESS JUMP TO WEAR')
                    : s.need.text + '   ' + Math.min(s.need.have(), s.need.goal) + ' / ' + s.need.goal;
  text(info, W / 2, 174, open ? pal.ink : pal.hero, 1, 'center');
}

/* ---- level editor ----
   The editor paints a 40x18 grid of characters (the playable rows 4..21). Plain tiles use the
   level map letters; trap brushes use their own letters, and on export every touching blob of
   one trap becomes a lettered group with a ready-made trap, so creators never write rules. */
const ED_ROWS = ROWS - 4, ED_TOP = 4, ED_Y0 = OY + ED_TOP * TS;   // ED_Y0: screen y of the first editable row
const ED_TOOLS = [
  { ch: '#', name: 'GROUND',        tip: 'SOLID GROUND.' },
  { ch: '^', name: 'SPIKE',         tip: 'POINTY. KILLS.' },
  { ch: 'v', name: 'CEILING SPIKE', tip: 'POINTS DOWN. ALSO KILLS.' },
  { ch: 'P', name: 'START',         tip: 'WHERE THE HERO BEGINS.' },
  { ch: 'D', name: 'DOOR',          tip: 'THE WAY OUT.' },
  { ch: 'F', name: 'FAKE DOOR',     tip: 'LOOKS LIKE THE EXIT. BITES.' },
  { ch: 'f', name: 'CRUMBLE',       tip: 'FALLS WHEN YOU STAND ON IT. PUT IT OVER A PIT.' },
  { ch: 'c', name: 'DROP BLOCK',    tip: 'FALLS WHEN YOU WALK UNDER IT.' },
  { ch: 's', name: 'SHY SPIKE',     tip: 'HIDDEN. POPS UP WHEN YOU GET CLOSE.' },
  { ch: 'g', name: 'GHOST BLOCK',   tip: 'SOLID, BUT INVISIBLE.' },
  { ch: 'p', name: 'FAKE BLOCK',    tip: 'LOOKS SOLID. IS NOT.' },
  { ch: 'm', name: 'LIFT',          tip: 'SLIDES INTO THE EMPTY SPACE AND BACK.' },
  { ch: 'k', name: 'CHASER',        tip: 'SPIKES THAT RISE AND HUNT YOU.' },
  { ch: '.', name: 'ERASER',        tip: 'CLEARS A TILE. RIGHT-CLICK ERASES TOO.' },
];
const ED_KINDS = 'fcsgpmk', GROUP_IDS = 'abcdefghijklmnopqrstuwxyz';   // no 'v': that's a ceiling spike
let ed = null, sharedLv = null;

// Keep only characters the pixel font can draw
const cleanText = (s, n) => String(s || '').toUpperCase().split('').filter(ch => FONT[ch]).join('')
  .replace(/\s+/g, ' ').trim().slice(0, n);

function edBlank() {
  const grid = Array.from({ length: ED_ROWS }, () => Array(COLS).fill('.'));
  for (let y = 14; y < ED_ROWS; y++) grid[y].fill('#');
  grid[13][2] = 'P'; grid[13][36] = 'D';
  return { grid, theme: 0, grudge: false, name: 'MY LEVEL', hint: 'TOTALLY SAFE. TRUST ME.' };
}

// Level <-> link code: "G1|theme|grudge|name|hint|run-length map", base64url so it survives any chat app
function edEncode(lv) {
  const flat = lv.grid.map(r => r.join('')).join('');
  let rle = '';
  for (let i = 0; i < flat.length; ) {
    let j = i; while (flat[j] === flat[i]) j++;
    rle += j - i > 2 ? (j - i) + flat[i] : flat.slice(i, j);
    i = j;
  }
  return btoa(['G1', lv.theme, lv.grudge ? 1 : 0, lv.name, lv.hint, rle].join('|'))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function edDecode(code) {
  try {
    const [ver, theme, grudge, name, hint, rle] = atob(code.replace(/-/g, '+').replace(/_/g, '/')).split('|');
    if (ver !== 'G1' || rle == null) return null;
    let flat = '';
    for (const m of rle.matchAll(/(\d*)(\D)/g)) flat += m[2].repeat(m[1] ? Math.min(+m[1], ED_ROWS * COLS) : 1);
    if (flat.length !== ED_ROWS * COLS || /[^.#^vPDF]/.test(flat.replace(/[fcsgpmk]/g, ''))) return null;
    const grid = [];
    for (let y = 0; y < ED_ROWS; y++) grid.push([...flat.slice(y * COLS, (y + 1) * COLS)]);
    const th = Math.floor(+theme);
    return { grid, theme: th >= 0 && th < PHASES.length ? th : 0, grudge: grudge === '1',
             name: cleanText(name, 16) || 'A LEVEL', hint: cleanText(hint, 44) || '...' };
  } catch (_) { return null; }
}

// Painted grid -> a level the engine can play (null without a start and a door)
function edBuild(lv) {
  // Read brushes from the editor grid, write group letters into a copy (the letters overlap brush letters)
  const src = lv.grid, rows = src.map(r => r.slice()), seen = src.map(r => r.map(() => false));
  const groups = {}, traps = [];
  const flat = src.map(r => r.join('')).join('');
  if (!flat.includes('P') || !flat.includes('D')) return null;
  let n = 0, dropped = 0;
  for (let y = 0; y < ED_ROWS; y++) for (let x = 0; x < COLS; x++) {
    const kind = src[y][x];
    if (seen[y][x] || !ED_KINDS.includes(kind)) continue;
    const cells = [], stack = [[x, y]];                 // flood-fill the blob so it acts as one piece
    seen[y][x] = true;
    while (stack.length) {
      const [cx, cy] = stack.pop(); cells.push([cx, cy]);
      for (const [nx, ny] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]])
        if (src[ny] && src[ny][nx] === kind && !seen[ny][nx]) { seen[ny][nx] = true; stack.push([nx, ny]); }
    }
    if (n >= GROUP_IDS.length) { for (const [cx, cy] of cells) rows[cy][cx] = '.'; dropped++; continue; }
    const id = GROUP_IDS[n++];
    for (const [cx, cy] of cells) rows[cy][cx] = id;
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1] + ED_TOP);   // game rows
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    switch (kind) {
      case 'f': groups[id] = {}; traps.push({ when: { touch: id }, g: id, do: 'fall', shake: 0.25 }); break;
      case 'c': groups[id] = {}; traps.push({ when: { zone: [x0 - 1.5, y1 + 1, x1 + 1.5, ROWS] }, g: id, do: 'fall', shake: 0.12 }); break;
      case 's': groups[id] = { spike: 1, hide: 1 }; traps.push({ when: { zone: [x0 - 3, y0 - 2, x1 + 3, y1 + 2] }, g: id, do: 'pop' }); break;
      case 'g': groups[id] = { ghost: 1 }; break;
      case 'p': groups[id] = { phantom: 1 }; break;
      case 'k': groups[id] = { spike: 1, hide: 1 }; traps.push({ when: { t: 0.8 }, g: id, do: 'chase', speed: 7 }); break;
      case 'm': groups[id] = { plat: 1, patrol: { dx: edLiftRun(rows, cells, id), speed: 4, wait: 0.6 } }; break;
    }
  }
  return { name: lv.name, hint: lv.hint, quips: [], groups, traps, grudge: lv.grudge, dropped,
           custom: true, label: 'CUSTOM', phase: lv.theme, num: 0, map: rows.map(r => r.join('')) };
}
// How far a lift can slide: rightwards into empty space if it can, otherwise leftwards
function edLiftRun(rows, cells, id) {
  const free = (x, y) => x >= 0 && x < COLS && (rows[y][x] === '.' || rows[y][x] === id);
  const reach = dir => { let d = 0; while (d < COLS && cells.every(([cx, cy]) => free(cx + (d + 1) * dir, cy))) d++; return d; };
  const r = reach(1);
  return r ? r : -reach(-1);
}

// The draft lives in the save, so closing the page never loses a level
function goEditor() {
  if (!ed) {
    const d = save.draft && edDecode(save.draft.code);
    ed = Object.assign(d || edBlank(), { tool: 0, cx: 2, cy: 13, verified: !!(d && save.draft.verified),
                                         dirty: false, savedAt: 0, painting: false, last: null, blipT: 0 });
    showToast(pad.hidden ? 'CLICK TO PAINT. RIGHT-CLICK ERASES. Q / E SWAP TOOLS.' : 'TAP OR DRAG TO PAINT. TURN SIDEWAYS FOR ROOM.');
  }
  state = 'editor'; menuT = 0; setPalette(ed.theme);
}
function edSaveDraft() { save.draft = { code: edEncode(ed), verified: ed.verified }; writeSave(); ed.dirty = false; ed.savedAt = time; }

function edPaint(x, y, ch) {
  if (ed.grid[y][x] === ch) return;
  if (ch === 'P' || ch === 'D') for (const row of ed.grid) for (let i = 0; i < COLS; i++) if (row[i] === ch) row[i] = '.';
  ed.grid[y][x] = ch; ed.verified = false; ed.dirty = true;
  if (time - ed.blipT > 0.05) { sfx.move(); ed.blipT = time; }
}
function edTool(i) { ed.tool = (i + ED_TOOLS.length) % ED_TOOLS.length; sfx.move(); showToast(ED_TOOLS[ed.tool].name + ': ' + ED_TOOLS[ed.tool].tip); }

// Browser dialogs pause the game; forget held keys afterwards so nothing sticks
function ask(question, value) { const s = prompt(question, value); input.left = input.right = input.jump = false; return s; }

function edAction(id) {
  if (id === 'back') { sfx.back(); edSaveDraft(); return fadeTo(goHome); }
  if (id === 'name') { const s = ask('Name your level (16 letters max):', ed.name); if (s != null) ed.name = cleanText(s, 16) || ed.name; }
  else if (id === 'hint') { const s = ask('What should the narrator say? A good lie works best (44 letters max):', ed.hint); if (s != null) ed.hint = cleanText(s, 44) || ed.hint; }
  else if (id === 'theme') { ed.theme = (ed.theme + 1) % PHASES.length; setPalette(ed.theme); showToast('THEME: ' + PHASES[ed.theme].name); }
  else if (id === 'grudge') { ed.grudge = !ed.grudge; ed.verified = false; showToast(ed.grudge ? 'GRUDGE ON: A SPIKE GROWS WHERE THEY LAST JUMPED.' : 'GRUDGE OFF.'); }
  else if (id === 'clear') { if (!confirm('Clear the whole level and start over?')) return; Object.assign(ed, edBlank(), { verified: false }); setPalette(0); }
  else if (id === 'test') return edTest();
  else if (id === 'share') return edShare();
  sfx.ok(); ed.dirty = true;
}

function edTest() {
  const lv = edBuild(ed);
  if (!lv) { sfx.nope(); return showToast('PUT A START AND A DOOR IN FIRST.'); }
  edSaveDraft(); sfx.ok();
  lv.fromEditor = true;
  fadeTo(() => { startLevel(lv); if (lv.dropped) showToast('TOO MANY TRAPS. ONLY 25 KEPT.'); });
}

function edShare() {
  if (!edBuild(ed)) { sfx.nope(); return showToast('PUT A START AND A DOOR IN FIRST.'); }
  if (!ed.verified) { sfx.nope(); return showToast('BEAT IT ONCE WITH TEST BEFORE SHARING.'); }
  edSaveDraft(); sfx.ok();
  const url = location.href.split('#')[0] + '#L=' + edEncode(ed);
  const text = `I made a Grudge level: "${ed.name}". Bet you can't beat it.`;
  if (navigator.share) return navigator.share({ title: 'Grudge', text, url }).catch(() => {});
  const fallback = () => ask('Copy this link and send it to a friend:', url);
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => showToast('LINK COPIED! SEND IT TO A FRIEND.'), fallback);
  else fallback();
}

const edTileAt = p => {
  if (!p) return null;
  const x = Math.floor(p.x / TS), y = Math.floor((p.y - ED_Y0) / TS);
  return x >= 0 && x < COLS && y >= 0 && y < ED_ROWS ? { x, y } : null;
};

function updateEditor(dt) {
  menuT += dt;
  const pr = input.presses, tap = hitAt(input.tap);
  if (pr.has('back')) return edAction('back');
  if (pr.has('prev')) edTool(ed.tool - 1);
  if (pr.has('next')) edTool(ed.tool + 1);
  if (tap && tap.startsWith('tool:')) edTool(+tap.slice(5));
  if (tap && tap.startsWith('ed:')) return edAction(tap.slice(3));
  // Keyboard / gamepad: move a cursor, paint with jump
  if (pr.has('left')) ed.cx = Math.max(0, ed.cx - 1);
  if (pr.has('right')) ed.cx = Math.min(COLS - 1, ed.cx + 1);
  if (pr.has('up')) ed.cy = Math.max(0, ed.cy - 1);
  if (pr.has('down')) ed.cy = Math.min(ED_ROWS - 1, ed.cy + 1);
  if (pr.has('ok')) edPaint(ed.cx, ed.cy, ED_TOOLS[ed.tool].ch);
  // Mouse / touch: paint while held, filling the gaps of fast drags (right button erases)
  if (input.ptrDown && input.ptr) {
    const t = edTileAt(input.ptr);
    if (input.ptrNew) { ed.painting = !!t; ed.last = null; }
    if (ed.painting && t) {
      const ch = input.ptrBtn === 2 ? '.' : ED_TOOLS[ed.tool].ch, a = ed.last || t;
      const steps = Math.max(Math.abs(t.x - a.x), Math.abs(t.y - a.y));
      for (let i = 0; i <= steps; i++) {
        const k = steps ? i / steps : 1;
        edPaint(Math.round(a.x + (t.x - a.x) * k), Math.round(a.y + (t.y - a.y) * k), ch);
      }
      ed.last = t; ed.cx = t.x; ed.cy = t.y;
    }
  } else ed.painting = false;
  const hov = edTileAt(input.hover);
  if (hov) { ed.cx = hov.x; ed.cy = hov.y; }
  if (ed.dirty && time - ed.savedAt > 1.5) edSaveDraft();
}

// One editor tile. Traps get a small mark so the creator can tell them apart from the real thing.
function drawEdTile(ch, x, y, icon = false) {
  const ink = pal.ink, bg = pal.bg;
  switch (ch) {
    case '#': rect(x, y, TS, TS, ink); break;
    case '^': ctx.drawImage(SPR.spike, x, y); break;
    case 'v': ctx.drawImage(SPR.spikeDown, x, y); break;
    case 'P': drawHero('idle0', x, y + TS); break;
    case 'D': case 'F':
      if (icon) drawSprite(SPR.door, x + 1, y - 3, false, 6, 12); else drawSprite(SPR.door, x, y - TS);
      if (ch === 'F') ctx.drawImage(SPR.skull, x + 2, icon ? y + 1 : y - 5);
      break;
    case 'f': rect(x, y, TS, TS, ink); rect(x + 2, y + 1, 1, 3, bg); rect(x + 3, y + 4, 1, 3, bg); rect(x + 5, y + 2, 1, 2, bg); break;
    case 'c': rect(x, y, TS, TS, ink); rect(x + 3, y + 1, 2, 4, bg); rect(x + 2, y + 4, 4, 1, bg); rect(x + 3, y + 5, 2, 1, bg); break;
    case 's': ctx.globalAlpha = 0.45; ctx.drawImage(SPR.spike, x, y); ctx.globalAlpha = 1; break;
    case 'g': ctx.globalAlpha = 0.3; rect(x, y, TS, TS, ink); ctx.globalAlpha = 1; break;
    case 'p': rect(x, y, TS, TS, ink); rect(x + 2, y + 2, 4, 4, bg); break;
    case 'm': drawSprite(SPR.plat, x, y); rect(x + 1, y + 3, 1, 1, bg); rect(x + 6, y + 3, 1, 1, bg); break;
    case 'k': ctx.drawImage(SPR.spikeHero, x, y); break;
    case '.': if (icon) for (let i = 0; i < 6; i++) { rect(x + 1 + i, y + 1 + i, 1, 1, ink); rect(x + 6 - i, y + 1 + i, 1, 1, ink); } break;
  }
}

function edButton(id, label, x, y, look) {                 // look: 'on' (lit), 'go' (call to action), 'off' (not ready)
  const w = textW(label) + 8, fill = look === 'on' ? pal.glow : look === 'go' ? pal.hero : pal.ink;
  if (look === 'off') ctx.globalAlpha = 0.45;
  rect(x, y, w, 11, fill);
  text(label, x + 4, y + 3, look === 'on' ? pal.ink : look === 'go' ? pal.glow : pal.bg);
  ctx.globalAlpha = 1;
  hit(x, y - 1, w, 13, 'ed:' + id);
  return w;
}

function drawEditor() {
  drawBackdrop(PHASES[ed.theme].motif, menuT);
  ctx.globalAlpha = 0.2;                                    // faint dots on the tile corners
  for (let y = 0; y <= ED_ROWS; y++) for (let x = 0; x <= COLS; x++) rect(x * TS, ED_Y0 + y * TS, 1, 1, pal.ink);
  ctx.globalAlpha = 1;
  for (let y = 0; y < ED_ROWS; y++) for (let x = 0; x < COLS; x++) drawEdTile(ed.grid[y][x], x * TS, ED_Y0 + y * TS);
  if ((menuT * 3 | 0) % 2 === 0 || ed.painting) {           // cursor
    const x = ed.cx * TS, y = ED_Y0 + ed.cy * TS;
    rect(x, y, TS, 1, pal.hero); rect(x, y + TS - 1, TS, 1, pal.hero); rect(x, y, 1, TS, pal.hero); rect(x + TS - 1, y, 1, TS, pal.hero);
  }
  // Toolbar: brushes on top, actions below
  rect(0, 0, W, ED_Y0 - 3, pal.bg); rect(0, ED_Y0 - 3, W, 1, pal.ink);
  ED_TOOLS.forEach((t, i) => {
    const x = 4 + i * 16;
    if (i === ed.tool) { rect(x, 1, 15, 15, pal.glow); rect(x, 16, 15, 1, pal.hero); }
    drawEdTile(t.ch, x + 4, 5, true);
    hit(x, 0, 16, 18, 'tool:' + i);
  });
  text(ED_TOOLS[ed.tool].name, 232, 6, pal.ink);
  let x = 4;
  for (const [id, label, look] of [['back', '<'], ['name', 'NAME'], ['hint', 'HINT'], ['theme', 'THEME'],
                                   ['grudge', 'GRUDGE', ed.grudge ? 'on' : ''], ['clear', 'CLEAR']])
    x += edButton(id, label, x, 20, look) + 3;
  const sw = textW('SHARE') + 8, tw = textW('TEST') + 8;
  edButton('share', 'SHARE', W - 4 - sw, 20, ed.verified ? 'go' : 'off');
  edButton('test', 'TEST', W - 7 - sw - tw, 20, 'go');
}

// Someone opened a level link: show what it is before playing it
function drawSharedCard() {
  drawBackdrop(PHASES[sharedLv.phase].motif, cardT);
  band(46, 78);
  text('SOMEONE MADE THIS LEVEL FOR YOU', W / 2, 54, pal.glow, 1, 'center');
  text(sharedLv.name, W / 2, 68, pal.bg, 3, 'center');
  text('"' + sharedLv.hint + '"', W / 2, 92, pal.bg, 1, 'center');
  if (sharedLv.grudge) text('IT HOLDS A GRUDGE.', W / 2, 106, pal.glow, 1, 'center');
  if (cardT > 0.6 && (cardT * 2 | 0) % 2 === 0) text('PRESS JUMP', W / 2, 140, pal.ink, 1, 'center');
}

function updatePhases(dt) {
  menuT += dt;
  const hov = hitAt(input.hover);
  if (hov && hov.startsWith('ph:')) phaseSel = +hov.slice(3);
  const pr = input.presses, N = PHASES.length;
  if (pr.has('left')) { phaseSel = (phaseSel + N - 1) % N; sfx.move(); }
  if (pr.has('right')) { phaseSel = (phaseSel + 1) % N; sfx.move(); }
  if (pr.has('up') || pr.has('down')) { phaseSel = phaseSel < 6 ? Math.min(N - 1, phaseSel + 6) : phaseSel - 6; sfx.move(); }
  const tap = hitAt(input.tap);
  if (pr.has('back') || tap === 'back') { sfx.back(); return fadeTo(goHome); }
  let pick = pr.has('ok') ? phaseSel : null;
  if (tap && tap.startsWith('ph:')) pick = phaseSel = +tap.slice(3);
  if (pick == null) return;
  if (!phaseUnlocked(pick)) { sfx.nope(); shake(2, 0.15); return; }
  sfx.ok(); fadeTo(() => goLevels(pick));
}

function drawPhases() {
  drawBackdrop(PHASES[palPhase].motif, menuT);
  text('< BACK', 6, 6, pal.ink); hit(0, 0, 40, 16, 'back');
  text('CHOOSE A PHASE', W / 2, 8, pal.ink, 2, 'center');
  const cw = 44, ch = 58, gap = 6, x0 = (W - (cw * 6 + gap * 5)) / 2;
  let sxh = 0;
  if (shakeT > 0) sxh = Math.round((Math.random() * 2 - 1) * shakeMag * 0.5);
  PHASES.forEach((ph, i) => {
    const [bg, deco, ink, hero, glow] = ph.pal;
    const sel = i === phaseSel, open = phaseUnlocked(i);
    const x = x0 + (i % 6) * (cw + gap) + (sel ? sxh : 0), y = 30 + Math.floor(i / 6) * (ch + 14) - (sel ? 3 : 0);
    if (sel) rect(x + 2, y + 3, cw, ch, pal.hero);
    if (open) {
      rect(x, y, cw, ch, bg);
      disc(x + cw - 9, y + 10, 5, deco);
      text(String(i + 1), x + 5, y + 5, ink, 3);
      for (let k = 0; k < 5; k++) rect(x + 5 + k * 7, y + 28, 5, 5, isCleared(i * 5 + k) ? ink : deco);
      rect(x, y + ch - 16, cw, 16, ink);
      const words = ph.name.split(' ');
      if (words.length > 1 && textW(ph.name) > cw - 4) {
        text(words[0], x + cw / 2, y + ch - 14, bg, 1, 'center'); text(words.slice(1).join(' '), x + cw / 2, y + ch - 7, bg, 1, 'center');
      } else text(ph.name, x + cw / 2, y + ch - 10, bg, 1, 'center');
    } else {
      rect(x, y, cw, ch, ink);
      ctx.drawImage(bakeLock(bg), Math.round(x + cw / 2 - 5), y + 16, 10, 14);
      text(String(i + 1), x + cw / 2, y + ch - 12, deco, 1, 'center');
    }
    if (sel) drawHero('idle0', x + cw / 2 - 4, y);
    hit(x, y, cw, ch, 'ph:' + i);
  });
  const ph = PHASES[phaseSel];
  text(phaseUnlocked(phaseSel) ? ph.tag : 'CLEAR THE PHASE BEFORE IT TO UNLOCK.', W / 2, 168, pal.ink, 1, 'center');
}
const lockCache = {};
function bakeLock(color) { return lockCache[color] || (lockCache[color] = bakeSprite(LOCK, { 1: color })); }

function updateLevels(dt) {
  menuT += dt;
  const hov = hitAt(input.hover);
  if (hov && hov.startsWith('lv:')) levelSel = +hov.slice(3);
  const pr = input.presses;
  if (pr.has('left') || pr.has('up')) { levelSel = (levelSel + 4) % 5; sfx.move(); }
  if (pr.has('right') || pr.has('down')) { levelSel = (levelSel + 1) % 5; sfx.move(); }
  const tap = hitAt(input.tap);
  if (pr.has('back') || tap === 'back') { sfx.back(); return fadeTo(() => goPhases(levelPhase)); }
  let pick = pr.has('ok') ? levelSel : null;
  if (tap && tap.startsWith('lv:')) pick = levelSel = +tap.slice(3);
  if (pick == null) return;
  const i = levelPhase * 5 + pick;
  if (!isUnlocked(i)) { sfx.nope(); shake(2, 0.15); return; }
  sfx.ok(); fadeTo(() => loadLevel(i));
}

function drawLevels() {
  const ph = PHASES[levelPhase];
  drawBackdrop(ph.motif, menuT);
  text('< PHASES', 6, 6, pal.ink); hit(0, 0, 48, 16, 'back');
  text('PHASE ' + pad2(levelPhase + 1), W / 2, 8, pal.ink, 1, 'center');
  text(ph.name, W / 2, 18, pal.ink, 3, 'center');
  text(ph.tag, W / 2, 39, pal.ink, 1, 'center');
  const i = levelPhase * 5 + levelSel, lv = LEVELS[i];
  rect(0, 54, W, 30, pal.ink);
  text(levelLabel(lv) + (isCleared(i) ? '   CLEARED' : isUnlocked(i) ? '   NEW' : '   LOCKED'), W / 2, 59, pal.glow, 1, 'center');
  text(isUnlocked(i) ? lv.name : '? ? ?', W / 2, 69, pal.bg, 2, 'center');
  const b = save.best[i];
  if (b) text((b.d === 0 ? 'DEATHLESS!' : 'BEST ' + b.d + (b.d === 1 ? ' DEATH' : ' DEATHS')) + '    ' + fmtTime(b.t), W / 2, 90, pal.ink, 1, 'center');
  const gy = 150;
  rect(0, gy, W, H - gy, pal.ink);
  let sxh = shakeT > 0 ? Math.round((Math.random() * 2 - 1) * shakeMag * 0.5) : 0;
  for (let k = 0; k < 5; k++) {
    const idx = levelPhase * 5 + k, cx = 40 + k * 60, sel = k === levelSel;
    const x = cx - 8 + (sel ? sxh : 0), y = gy - 32;
    if (isUnlocked(idx)) drawSprite(SPR.door, x, y, false, 16, 32);
    else { rect(x, y, 16, 32, pal.ink); ctx.drawImage(SPR.lock, x + 3, y + 10, 10, 14); }
    if (isCleared(idx)) drawSprite(SPR.stone, x + 18, gy - 8);
    if (save.best[idx] && save.best[idx].d === 0) ctx.drawImage(SPR.star, x + 19, gy - 15);
    text(String(k + 1), cx, sel ? y - 15 : y - 9, sel ? pal.hero : pal.ink, sel ? 2 : 1, 'center');
    if (sel) drawHero((menuT * 2 | 0) % 2 ? 'idle0' : 'idle1', x - 12, gy);
    hit(cx - 24, y - 16, 48, 50, 'lv:' + k);
  }
  text('LEFT / RIGHT PICK    SPACE ENTER    ESC BACK', W / 2, gy + 12, pal.bg, 1, 'center');
}

function drawPhaseCard() {
  const ph = PHASES[LEVELS[cardLevel].phase];
  drawBackdrop(ph.motif, cardT);
  band(52, 70);
  text('PHASE ' + pad2(ph.levels[0].phase + 1) + ' OF ' + PHASES.length, W / 2, 60, pal.glow, 1, 'center');
  text(ph.name, W / 2, 74, pal.bg, 4, 'center');
  text(ph.tag, W / 2, 104, pal.bg, 1, 'center');
  if (cardT > 0.6 && (cardT * 2 | 0) % 2 === 0) text('PRESS JUMP', W / 2, 134, pal.ink, 1, 'center');
}

function drawEnding() {
  drawBackdrop('heart', endT);
  const gy = H - 24;
  rect(0, gy, W, 24, pal.ink);
  const n = Math.min(deaths, 36);                       // a monument of your failures
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / 9), col = i % 9;
    if (col >= Math.max(1, 9 - row)) continue;
    ctx.drawImage(SPR.stone, 196 + col * 8 + row * 4, gy - 8 - row * 8);
  }
  drawHero('idle0', 40, gy);
  text(endBonus ? 'YOU GOT OUT. AGAIN.' : 'YOU GOT OUT.', 20, 22, pal.ink, endBonus ? 2 : 3);
  text(clearedCount() + ' LEVELS CLEARED. TOTAL DEATHS', 20, 54, pal.ink, 1);
  text(String(deaths), 20, 63, pal.hero, 4);
  const rank = deaths <= 60 ? 'THE LEVEL IS AFRAID OF YOU.' : deaths <= 150 ? 'A RESPECTABLE AMOUNT OF SPITE.'
             : deaths <= 300 ? 'THE LEVEL HAD A WONDERFUL TIME.' : 'THE LEVEL WOULD LIKE TO KEEP YOU.';
  text(rank, 20, 92, pal.ink, 1);
  text('IT WILL REMEMBER YOU.', 20, 101, pal.ink, 1);
  text('TIME ' + fmtTime(save.playT) + '    DEATHLESS ' + deathlessCount(), 20, 112, pal.ink, 1);
  if (endT > 0.8 && (endT * 2 | 0) % 2 === 0) text('PRESS JUMP FOR THE MENU', 20, 124, pal.hero, 1);
  if (!endBonus && !isCleared(LEVELS.length - 1)) text('PHASE 11 IS OPEN. IT REMEMBERS YOU.', 20, 136, pal.ink, 1);
}

/* ===================== 12. GAME STATES + LOOP ====================== */
function fadeTo(cb) { if (fade.dir > 0) return; fade.dir = 1; fade.cb = cb; }

function update(dt) {
  time += dt;
  if (toastT > 0) toastT -= dt;
  if (flashT > 0) flashT -= dt;
  if (skullT > 0) skullT -= dt;
  narrT += dt;                                        // typewriter, with a blip every other letter
  const n = Math.min(narr.length, Math.floor(narrT * 45));
  if (n > narrN) { if (narrBlip && n % 2 === 0 && narr[n - 1] !== ' ') sfx.say(); narrN = n; }
  updateMusic();
  if (hitStop > 0) {                                  // freeze a few frames when you die
    hitStop -= dt;
    input.jumpPressed = input.restartPressed = false; input.presses.clear(); input.tap = null;
    return;
  }
  if (fade.dir) {
    fade.a += fade.dir * dt / 0.22;
    if (fade.dir > 0 && fade.a >= 1) { fade.a = 1; fade.dir = -1; const cb = fade.cb; fade.cb = null; if (cb) cb(); }
    else if (fade.dir < 0 && fade.a <= 0) { fade.a = 0; fade.dir = 0; }
  }
  if (shakeT > 0) shakeT -= dt;
  updateParticles(dt);
  if (fade.dir <= 0) {
    const inLevel = state === 'play' || state === 'dead';
    if (inLevel && (input.presses.has('back') || (input.tap && hitAt(input.tap) === 'menu'))) {
      sfx.back();
      if (L.custom) fadeTo(L.fromEditor ? goEditor : goHome);
      else { const p = L.phase, k = L.num; fadeTo(() => goLevels(p, k)); }
    } else switch (state) {
      case 'title': updateHome(dt); break;
      case 'phases': updatePhases(dt); break;
      case 'levels': updateLevels(dt); break;
      case 'skins': updateSkins(dt); break;
      case 'editor': updateEditor(dt); break;
      case 'shared':
        cardT += dt;
        if (input.presses.has('back')) fadeTo(goHome);
        else if (cardT > 0.4 && (input.presses.has('ok') || input.jumpPressed || input.tap)) { cardT = -99; fadeTo(() => startLevel(sharedLv)); }
        break;
      case 'card':
        cardT += dt;
        if (cardT > 2.4 || (cardT > 0.3 && (input.presses.has('ok') || input.jumpPressed || input.tap))) { const i = cardLevel; cardT = -99; fadeTo(() => loadLevel(i)); }
        break;
      case 'play': save.playT += dt; updatePlay(dt); break;
      case 'dead':
        save.playT += dt; deadT += dt; updateGroups(dt);
        if (deadT > DEAD_PAUSE || (deadT > 0.15 && (input.jumpPressed || input.restartPressed))) startAttempt();
        break;
      case 'exit':
        exitT += dt;
        if (exitT > 0.45 && !exitDone) {
          exitDone = true;
          recordClear();
          if (runs.length >= 3) startReplay(); else leaveLevel();
        }
        break;
      case 'replay':
        replayT += dt; updateReplay();
        if (replayT > replayDur || (replayT > 0.4 && (input.jumpPressed || input.presses.has('ok') || input.presses.has('back') || input.tap)))
          leaveLevel();
        break;
      case 'ending':
        endT += dt;
        if (endT > 0.8 && (input.jumpPressed || input.presses.has('ok') || input.tap)) fadeTo(goHome);
        break;
    }
  }
  input.jumpPressed = input.restartPressed = false;
  input.presses.clear(); input.tap = null; input.ptrNew = false;
}

function recordClear() {
  runs.push({ p: rec, dead: false });
  if (L.custom) return;                                // custom levels don't touch progress or stats
  save.cleared[li] = true;
  const b = save.best[li] || (save.best[li] = {});
  b.d = b.d == null ? levelDeaths : Math.min(b.d, levelDeaths);
  b.t = b.t == null ? levelTime : Math.min(b.t, levelTime);
  checkUnlocks(); writeSave();
}
function startReplay() {
  const longest = Math.max(...runs.map(r => r.p.length / 3)) / 30;   // seconds
  replaySpeed = Math.max(1, longest / 5);                           // never longer than ~5s
  replayDur = longest / replaySpeed + 1;
  replayT = 0; state = 'replay';
}
function leaveLevel() {
  if (L.custom) {
    const tries = levelDeaths + 1, fromEditor = L.fromEditor;
    return fadeTo(() => {
      if (fromEditor) { goEditor(); ed.verified = true; edSaveDraft(); showToast('BEATEN! NOW YOU CAN SHARE IT.'); }
      else { goHome(); showToast(tries > 1 ? `YOU BEAT IT IN ${tries} TRIES.` : 'BEATEN ON THE FIRST TRY!'); }
    });
  }
  const next = li + 1;
  fadeTo(() => {
    if (li === MAIN_LEVELS - 1 || next >= LEVELS.length) {
      state = 'ending'; endT = 0; endBonus = li >= MAIN_LEVELS; setPalette(endBonus ? PHASES.length - 1 : MAIN_PHASES - 1);
    }
    else if (LEVELS[next].phase !== L.phase) goCard(next);
    else loadLevel(next);
  });
}

function updatePlay(dt) {
  // First visit: the level waits behind its title until you move
  if (introT > 0 && levelDeaths === 0) {
    if (input.left || input.right || input.jumpPressed) introT = 0;
    else { introT -= dt; if (introT > 0) return; }
  }
  levelTime += dt;
  if (greet && levelTime > 2.2) { const g = greet; greet = null; if (narr === g) setNarr(L.hint); }
  if (msgT > 0) msgT -= dt;
  if (reverseT > 0) reverseT -= dt;
  if (input.restartPressed) return kill('restart');
  touched.clear(); jumped = false;
  updatePlayer(dt);
  if ((recTick++ & 1) === 0 && rec.length < 3000)     // 30 samples/s of x, y, facing for the replay
    rec.push(Math.round(player.x), Math.round(player.y), player.face < 0 ? 1 : 0);
  updateGroups(dt);
  updateDoor(dt);
  if (!player.alive) return;
  checkHazards();
  if (!player.alive) return;
  updateTraps(dt);
  if (player.y > ROWS * TS + 16) return kill('pit');
  if (door && overlap(player, { x: door.x + 2, y: door.y + 6, w: 4, h: 10 })) {
    state = 'exit'; exitT = 0; exitDone = false; sfx.win(); buzz([15, 50, 15]);
    burst(door.x + 4, door.y + 8, pal.glow, 14, 80, 0.6);
  }
}

function canvasPos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  initAudio(); cv.focus(); input.tap = canvasPos(e); input.hover = input.tap;
  input.ptr = input.tap; input.ptrDown = true; input.ptrBtn = e.button; input.ptrNew = true;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  const p = canvasPos(e);
  if (e.pointerType === 'mouse') input.hover = p;
  if (input.ptrDown) input.ptr = p;
});
const ptrUp = () => { input.ptrDown = false; };
cv.addEventListener('pointerup', ptrUp);
cv.addEventListener('pointercancel', ptrUp);
cv.addEventListener('pointerleave', () => { input.hover = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());       // right-click erases in the editor

let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  pollGamepad();
  acc += dt;
  while (acc >= DT) { update(DT); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}

// A shared level arrives as #L=<code> on the page address
function openLevelLink() {
  if (!location.hash.startsWith('#L=')) return false;
  const d = edDecode(location.hash.slice(3)), lv = d && edBuild(d);
  try { history.replaceState(null, '', location.href.split('#')[0]); } catch (_) {}
  if (!lv) { goHome(); showToast('THAT LEVEL LINK IS BROKEN.'); return true; }
  sharedLv = lv; state = 'shared'; cardT = 0; setPalette(lv.phase);
  return true;
}

// Keep progress across live page updates when the viewer supports it
window.claude?.hot?.snapshot?.(() => ({ li, playing: state === 'play' || state === 'dead' }));
function start(data) {
  loadSave();
  deaths = save.deaths || 0; muted = save.sound === 0;
  returning = deaths > 0 || clearedCount() > 0;
  checkUnlocks(true);
  addEventListener('visibilitychange', () => { if (document.hidden) writeSave(); });   // keep play time
  addEventListener('hashchange', openLevelLink);           // a level link opened in an already-open tab
  if (openLevelLink()) {}
  else if (data && data.playing && typeof data.li === 'number' && LEVELS[data.li]) loadLevel(data.li);
  else goHome();
  resize();
  cv.focus();
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
