<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grudge</title>
<meta name="theme-color" content="#e9a23b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grudge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one integer-scaled 320x180 canvas centered on a page that takes the current phase's background color. */
:root {
  --bg: #e9a23b;     /* current phase background (set from JS) */
  --ink: #3a2213;    /* current phase ink: ground, spikes, doors */
  --glow: #fbe7c0;   /* current phase highlight */
  color-scheme: light;
}
html, body { height: 100%; overscroll-behavior: none; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background-color .2s steps(2);
}
#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  max-width: 100%;
  outline: none;
  cursor: pointer;
  touch-action: none;   /* drags paint in the level editor instead of scrolling */
}
[hidden] { display: none !important; }
/* Phones held upright: room for the corner buttons above the game and the controls below it */
body.touch {
  padding: calc(64px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px))
           calc(116px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
/* Phones held sideways: the game fills the screen and the controls float over it */
body.touch.land {
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
           env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#turn {
  margin: 12px 0 0;
  font: 700 11px/1.3 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: .08em;
  text-align: center;
  opacity: .75;
}
#pad { position: fixed; inset: 0; pointer-events: none; }
#pad > * { position: absolute; pointer-events: auto; touch-action: none; }
.key {
  display: flex; align-items: center; justify-content: center;
  box-sizing: border-box; padding: 0;
  border: 0; border-radius: 0;
  background: var(--ink);
  color: var(--glow);
  font: 700 20px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: .06em;
  opacity: .82;
}
.key.small { width: 44px; height: 44px; font-size: 16px; }
.key.on { opacity: 1; transform: translateY(2px); }
.key:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.key svg { width: 18px; height: 18px; }
#dpad { display: flex; gap: 6px; width: 160px; height: 80px;
        left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#dpad .key { flex: 1; font-size: 24px; }
#bJ { width: 108px; height: 80px;
      right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#bB { left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
#bF { left: calc(62px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
#bX { right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
/* Sideways they sit on top of the game, so let it show through, with an edge that reads on the dark ground */
body.land .key { opacity: .55; box-shadow: inset 0 0 0 2px var(--glow); }
body.land .key.on { opacity: .9; }
body.land #bF { left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(62px + env(safe-area-inset-top, 0px)); }
/* The level editor is edited by touching the canvas directly; its toolbar has its own back button */
#pad.editing > * { display: none; }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>

<canvas id="game" width="320" height="180" tabindex="0" aria-label="Grudge, a troll platformer. Arrow keys or WASD to move, Space to jump, R to restart, Escape for menu, M to mute."></canvas>
<p id="turn" hidden>TURN YOUR PHONE SIDEWAYS<br>FOR A BIGGER SCREEN</p>
<div id="pad" hidden>
  <div id="dpad" role="group" aria-label="Move. Hold an arrow, or slide your thumb between them.">
    <span class="key">&#9664;</span><span class="key">&#9654;</span>
  </div>
  <button id="bJ" class="key" aria-label="Jump, or select in menus">JUMP</button>
  <button id="bB" class="key small" aria-label="Back to the menu">&lt;</button>
  <button id="bF" class="key small" aria-label="Full screen" hidden>
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true">
      <path d="M2 7V2h5M11 2h5v5M16 11v5h-5M7 16H2v-5"/></svg>
  </button>
  <button id="bX" class="key small" aria-label="Restart the level">R</button>
</div>

<script>
'use strict';
/* =====================================================================
   GRUDGE  -  a tiny troll platformer
   "The level never forgets. Neither do you."
   10 phases x 5 levels. Each phase has its own palette, backdrop and trick.

   Sections:
     1. CONFIG        6. LEVEL LOADING   11. MENUS
     2. INPUT         7. PHYSICS         12. GAME STATES + LOOP
     3. FONT          8. TRAPS
     4. SPRITES       9. RENDERING
     5. PHASES/LEVELS 10. AUDIO
   ===================================================================== */

/* ============================ 1. CONFIG ============================ */
const W = 320, H = 180;          // native resolution
const TS = 8;                    // tile size in pixels
const COLS = 40, ROWS = 22;      // level grid (40x22 tiles = 320x176)
const OY = H - ROWS * TS;        // 4px top margin
const DT = 1 / 60;               // fixed timestep
const PH = {                     // player physics (pixels, seconds)
  run: 90, accG: 1100, accA: 800, accIdleAir: 160, fric: 1400,
  grav: 820, jump: 195, cut: 0.45, maxFall: 320,
  coyote: 0.09, buffer: 0.12,
};
const MAX_STONES = 3;            // grudge stones kept per level (oldest crumbles)
const DEAD_PAUSE = 0.7;          // seconds before auto-respawn
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SAVE_KEY = 'grudge-save-v2';

/* ============================ 2. INPUT ============================= */
// Held state for gameplay, plus one-shot "presses" for menus.
const input = { left: false, right: false, jump: false, jumpPressed: false, restartPressed: false,
                presses: new Set(), tap: null, hover: null,
                ptr: null, ptrDown: false, ptrBtn: 0, ptrNew: false };   // held pointer on the canvas (editor drags)
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
                 Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump' };
const MENUKEYS = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
                   ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
                   Space: 'ok', Enter: 'ok', KeyZ: 'ok', Escape: 'back', Backspace: 'back',
                   KeyQ: 'prev', KeyE: 'next' };
addEventListener('keydown', e => {
  initAudio();
  const k = KEYMAP[e.code];
  if (k) { if (k === 'jump' && !input.jump) input.jumpPressed = true; input[k] = true; }
  if (MENUKEYS[e.code] || k) e.preventDefault();
  if (!e.repeat && MENUKEYS[e.code]) input.presses.add(MENUKEYS[e.code]);
  if (e.code === 'KeyR' && !e.repeat) input.restartPressed = true;
  if (e.code === 'KeyM' && !e.repeat) cycleSound();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) input[k] = false; });
addEventListener('blur', () => { input.left = input.right = input.jump = false; });

// On-screen controls for phones (they also drive the menus)
const pad = document.getElementById('pad'), turnHint = document.getElementById('turn');
const bX = document.getElementById('bX'), bF = document.getElementById('bF');
function bindButton(id, down, up) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio(); down();
    b.classList.add('on');
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
  });
  const off = () => { if (up) up(); b.classList.remove('on'); };
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
bindButton('bJ', () => { input.presses.add('ok'); if (!input.jump) input.jumpPressed = true; input.jump = true; },
                 () => { input.jump = false; });
bindButton('bX', () => { input.restartPressed = true; });          // only shown inside a level
bindButton('bB', () => { input.presses.add('back'); });
bindButton('bF', toggleFullscreen);

// Move strip: one control for both arrows, so a thumb can slide from one to the other without lifting
const dpad = document.getElementById('dpad'), [dL, dR] = dpad.children;
let dpadId = null, dpadDir = 0;
function dpadSet(dir) {
  if (dir && dir !== dpadDir) input.presses.add(dir < 0 ? 'left' : 'right');
  dpadDir = dir; input.left = dir < 0; input.right = dir > 0;
  dL.classList.toggle('on', dir < 0); dR.classList.toggle('on', dir > 0);
}
const dpadAim = e => { const r = dpad.getBoundingClientRect(); dpadSet(e.clientX < r.left + r.width / 2 ? -1 : 1); };
dpad.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio(); dpadId = e.pointerId;
  try { dpad.setPointerCapture(e.pointerId); } catch (_) {}
  dpadAim(e);
});
dpad.addEventListener('pointermove', e => { if (e.pointerId === dpadId) dpadAim(e); });
const dpadOff = e => { if (e.pointerId === dpadId) { dpadId = null; dpadSet(0); } };
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) dpad.addEventListener(t, dpadOff);
dpad.addEventListener('contextmenu', e => e.preventDefault());

// Full screen where the browser allows it (Android); on iPhone, Add to Home Screen does the same job
bF.hidden = !(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) return (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
                   .catch(() => {});
}
// A short buzz on phones that can (follows the SHAKE setting)
const buzz = pattern => {
  const tapped = !navigator.userActivation || navigator.userActivation.hasBeenActive;   // browsers refuse before a tap
  if (save.shake && !pad.hidden && tapped && navigator.vibrate) try { navigator.vibrate(pattern); } catch (_) {}
};

function showPad() { if (pad.hidden) { pad.hidden = false; resize(); } }
if (matchMedia('(hover: none) and (pointer: coarse)').matches) pad.hidden = false;
addEventListener('touchstart', showPad, { passive: true });

// Gamepad: d-pad or left stick moves, A jumps / confirms, B or Select backs out, X or Y restarts, Start confirms.
let gpPrev = {};
function pollGamepad() {
  let gp = null;
  try { gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(g => g && g.connected); } catch (_) {}
  if (!gp) return;
  const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed), ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const now = { left: b(14) || ax < -0.4, right: b(15) || ax > 0.4, up: b(12) || ay < -0.5, down: b(13) || ay > 0.5,
                jump: b(0), back: b(1) || b(8), restart: b(2) || b(3), start: b(9) };
  for (const k of ['left', 'right', 'jump']) if (now[k] !== !!gpPrev[k]) {     // only touch held keys on change
    if (k === 'jump' && now.jump && !input.jump) input.jumpPressed = true;
    input[k] = now[k];
  }
  const edge = k => now[k] && !gpPrev[k];
  for (const k of ['left', 'right', 'up', 'down', 'back']) if (edge(k)) input.presses.add(k);
  if (edge('jump') || edge('start')) input.presses.add('ok');
  if (edge('restart')) input.restartPressed = true;
  gpPrev = now;
}

/* ============================ 3. FONT ============================== */
// 3x5 bitmap font. Each glyph = 5 rows, each row a 3-bit number (4 = left pixel, 1 = right pixel).
const FONT = {
  A:[2,5,7,5,5], B:[6,5,6,5,6], C:[3,4,4,4,3], D:[6,5,5,5,6], E:[7,4,6,4,7], F:[7,4,6,4,4],
  G:[3,4,5,5,3], H:[5,5,7,5,5], I:[7,2,2,2,7], J:[1,1,1,5,2], K:[5,5,6,5,5], L:[4,4,4,4,7],
  M:[5,7,7,5,5], N:[6,5,5,5,5], O:[2,5,5,5,2], P:[6,5,6,4,4], Q:[2,5,5,6,3], R:[6,5,6,5,5],
  S:[3,4,2,1,6], T:[7,2,2,2,2], U:[5,5,5,5,7], V:[5,5,5,5,2], W:[5,5,7,7,5], X:[5,5,2,5,5],
  Y:[5,5,2,2,2], Z:[7,1,2,4,7],
  '0':[7,5,5,5,7], '1':[2,6,2,2,7], '2':[6,1,2,4,7], '3':[6,1,2,1,6], '4':[5,5,7,1,1],
  '5':[7,4,6,1,6], '6':[3,4,7,5,7], '7':[7,1,2,2,2], '8':[7,5,7,5,7], '9':[7,5,7,1,6],
  '.':[0,0,0,0,2], ',':[0,0,0,2,4], '!':[2,2,2,0,2], '?':[6,1,2,0,2], "'":[2,2,0,0,0],
  '"':[5,5,0,0,0], '-':[0,0,7,0,0], ':':[0,2,0,2,0], '/':[1,1,2,4,4], '(':[1,2,2,2,1],
  ')':[4,2,2,2,4], '<':[1,2,4,2,1], '>':[4,2,1,2,4], '+':[0,2,7,2,0], '#':[5,7,5,7,5],
  '=':[0,7,0,7,0], '_':[0,0,0,0,7], ' ':[0,0,0,0,0],
};
const textW = (s, sc = 1) => String(s).length * 4 * sc - sc;
function text(str, x, y, col, sc = 1, align = 'left') {
  str = String(str).toUpperCase();
  const w = textW(str, sc);
  if (align === 'center') x = Math.round(x - w / 2); else if (align === 'right') x = x - w;
  ctx.fillStyle = col;
  for (const ch of str) {
    const g = FONT[ch];
    if (g) for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++)
      if ((g[r] >> (2 - c)) & 1) ctx.fillRect(x + c * sc, y + r * sc, sc, sc);
    x += 4 * sc;
  }
}

/* ============================ 4. SPRITES =========================== */
// Pixel maps: '.' transparent, '1' main color, '2' secondary color.
const HERO = {
  idle0: ['..1111..', '.111111.', '11111111', '11121121', '11121121', '11111111', '.111111.', '.11..11.'],
  idle1: ['..1111..', '.111111.', '11111111', '11111111', '11121121', '11111111', '.111111.', '.11..11.'],
  run0:  ['..1111..', '.111111.', '11111111', '11121121', '11121121', '11111111', '.111111.', '11....1.'],
  run1:  ['..1111..', '.111111.', '11111111', '11121121', '11121121', '11111111', '.111111.', '..1111..'],
  run2:  ['..1111..', '.111111.', '11111111', '11121121', '11121121', '11111111', '.111111.', '.1....11'],
  jump:  ['..1111..', '.111111.', '11111111', '11121121', '11121121', '11111111', '11111111', '.1....1.'],
  fall:  ['..1111..', '.111111.', '11111111', '11121121', '11121121', '11111111', '.111111.', '1......1'],
};
const RUN_CYCLE = ['run0', 'run1', 'run2', 'run1'];
const STONE = ['.111111.', '11111111', '12122121', '11211211', '12122121', '11111111', '11111111', '11111111'];
const SPIKE = ['........', '........', '.1....1.', '.1....1.', '111..111', '111..111', '11111111', '11111111'];
const PLAT  = ['11111111', '11111111', '11111111', '11111111', '11111111', '11111111', '.111111.', '..1111..'];
const DOOR  = ['.111111.', '11111111', '11222211', '11222211', '11222211', '11222211', '11222211', '11222211',
               '11222211', '11221211', '11222211', '11222211', '11222211', '11222211', '11222211', '11111111'];
const SKULL = ['.111.', '1.1.1', '11111', '.111.', '.1.1.'];
const LOCK  = ['.111.', '1...1', '1...1', '11111', '11.11', '11.11', '11111'];
const STAR  = ['..1..', '.111.', '11111', '.111.', '1...1'];

/* Skins: an optional hat stacked above the 8x8 body, plus a color style.
   Hat pixels: '1' body, '2' background, '4' phase highlight, '5' the skin's own color (c5).
   Styles: outline (light body, dark edge), gold, ghost (see-through, wavy hem). */
const SKINS = [
  { id: 'blob',     name: 'BLOB' },
  { id: 'tophat',   name: 'TOP HAT',  hat: ['..1111..', '..1111..', '..2222..', '.111111.'] },
  { id: 'bunny',    name: 'BUNNY',    hat: ['.11..11.', '.14..41.', '.11..11.'] },
  { id: 'cap',      name: 'CAP',      hat: ['..5555..', '..555555'], c5: '#d9443b',
    need: { text: 'CLEAR 5 LEVELS', have: () => clearedCount(), goal: 5 } },
  { id: 'sprout',   name: 'SPROUT',   hat: ['..55.55.', '...555..', '....1...'], c5: '#4f9a2c',
    need: { text: 'CLEAR SHY GARDEN', have: () => phaseCleared(1), goal: 5 } },
  { id: 'horns',    name: 'HORNS',    hat: ['5......5', '55....55'], c5: '#b8282a',
    need: { text: 'DIE 50 TIMES', have: () => deaths, goal: 50 } },
  { id: 'negative', name: 'NEGATIVE', style: 'outline',
    need: { text: 'CLEAR MIRROR HALL', have: () => phaseCleared(6), goal: 5 } },
  { id: 'ghost',    name: 'GHOST',    style: 'ghost',
    need: { text: 'DIE 150 TIMES', have: () => deaths, goal: 150 } },
  { id: 'halo',     name: 'HALO',     hat: ['..5555..', '........'], c5: '#f2c14e',
    need: { text: 'FINISH THE GAME', have: () => isCleared(MAIN_LEVELS - 1) ? 1 : 0, goal: 1 } },
  { id: 'crown',    name: 'CROWN',    hat: ['.5.55.5.', '.555555.'], c5: '#f2c14e',
    need: { text: '10 DEATHLESS CLEARS', have: () => deathlessCount(), goal: 10 } },
  { id: 'gold',     name: 'GOLD',     style: 'gold',
    need: { text: '25 DEATHLESS CLEARS', have: () => deathlessCount(), goal: 25 } },
  { id: 'party',    name: 'PARTY',    hat: ['...55...', '..5445..', '.555555.'], c5: '#e0508f',
    need: { text: 'CLEAR GRUDGE MATCH', have: () => phaseCleared(10), goal: 5 } },
];
const skinUnlocked = s => !s.need || s.need.have() >= s.need.goal;
const skinById = id => SKINS.find(s => s.id === id) || SKINS[0];

let SPR = {};
function bakeSprite(rows, cmap) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    g.fillStyle = cmap[ch]; g.fillRect(x, y, 1, 1);
  }));
  return c;
}
// Body pixels on the silhouette's edge become '6' (drawn in the outline color).
function edgeRows(rows) {
  const at = (x, y) => (rows[y] || '')[x] || '.';
  return rows.map((r, y) => [...r].map((ch, x) =>
    ch === '1' && [at(x - 1, y), at(x + 1, y), at(x, y - 1), at(x, y + 1)].includes('.') ? '6' : ch).join(''));
}
// One hero frame in a given skin, for the current palette (sil = solid ink silhouette for locked skins).
const skinCache = {};
function skinSprite(skin, frame, sil = false) {
  const key = skin.id + ':' + frame + ':' + palPhase + (sil ? ':sil' : '');
  if (skinCache[key]) return skinCache[key];
  let body = HERO[frame];
  if (skin.style === 'ghost') body = body.slice(0, 7).concat(frame.startsWith('run') ? '.11.11.1' : '1.11.11.');
  let rows = (skin.hat || []).concat(body);
  const lit = skin.style === 'outline' || skin.style === 'gold';
  if (lit) rows = edgeRows(rows);
  const fill = skin.style === 'gold' ? '#f2c14e' : skin.style === 'outline' ? pal.glow
             : skin.style === 'ghost' ? pal.hero + 'a8' : pal.hero;
  const cmap = sil ? { 1: pal.ink, 2: pal.ink, 4: pal.ink, 5: pal.ink, 6: pal.ink }
                   : { 1: fill, 2: lit ? pal.hero : pal.bg, 4: pal.glow, 5: skin.c5 || pal.hero, 6: pal.hero };
  return (skinCache[key] = bakeSprite(rows, cmap));
}
function bakeSprites() {
  SPR = {};
  const sk = skinById(save.skin);
  for (const k in HERO) SPR[k] = skinSprite(sk, k);
  SPR.star = bakeSprite(STAR, { 1: pal.glow });
  SPR.stone = bakeSprite(STONE, { 1: pal.ink, 2: pal.bg });
  SPR.spike = bakeSprite(SPIKE, { 1: pal.ink });
  SPR.spikeDown = bakeSprite([...SPIKE].reverse(), { 1: pal.ink });
  SPR.spikeHero = bakeSprite(SPIKE, { 1: pal.hero });          // editor: chaser spikes
  SPR.plat = bakeSprite(PLAT, { 1: pal.ink });
  SPR.door = bakeSprite(DOOR, { 1: pal.ink, 2: pal.glow });
  SPR.skull = bakeSprite(SKULL, { 1: pal.ink });
  SPR.lock = bakeSprite(LOCK, { 1: pal.bg });
}

/* ======================== 5. PHASES / LEVELS ======================= */
/*  A PHASE = { name, tag, motif, pal:[background, backdrop, ink, hero, glow], levels:[5 levels] }
    A LEVEL = { name, hint, pity, pityAt, quips, groups, map, traps }

    Map tiles (rows are 40 wide; the map is centered vertically and its last row is extended
    down to the screen edge, so write only the interesting part):
      .  empty            #  ground           ^  spike (up)      v  spike (down)

  if ('muted' in save) { if (save.muted) save.sound = 0; delete save.muted; }   // older saves
}

const isCleared = i => !!save.cleared[i];
const isUnlocked = i => i === 0 || isCleared(i - 1) || isCleared(i);
const phaseUnlocked = p => isUnlocked(p * 5);
const clearedCount = () => LEVELS.reduce((n, _, i) => n + (isCleared(i) ? 1 : 0), 0);
const firstOpenLevel = () => { for (let i = 0; i < LEVELS.length; i++) if (!isCleared(i)) return i; return -1; };
const themePhase = () => { const i = firstOpenLevel(); return i < 0 ? PHASES.length - 1 : LEVELS[i].phase; };
const phaseCleared = p => { let n = 0; for (let k = 0; k < 5; k++) n += isCleared(p * 5 + k) ? 1 : 0; return n; };
const deathlessCount = () => Object.values(save.best).filter(b => b.d === 0).length;
function fmtTime(s) {
  s = Math.max(0, s || 0);
  if (s < 60) return s.toFixed(1) + 'S';
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return (h ? h + ':' + pad2(m % 60) : m) + ':' + pad2(Math.floor(s % 60));
}

// Rebuild the level from its data. Stones and death counts persist between attempts.
function startAttempt() {
  // Center the level below the HUD, then extend its bottom row down to the screen edge
  // (ground stays ground, pits stay bottomless).
  const src = L.map.map(r => r.padEnd(COLS, '.').slice(0, COLS));
  const top = clamp(4 + Math.floor((ROWS - 4 - src.length) / 2), 0, Math.max(0, ROWS - src.length));
  const rows = [];
  for (let i = 0; i < top; i++) rows.push(E40);
  rows.push(...src.slice(0, ROWS - top));
  while (rows.length < ROWS) rows.push(src[src.length - 1]);
  bannerY = clamp(rows.findIndex(r => /[^.]/.test(r)) * TS + OY - 42, 34, 68);

  grid = new Uint8Array(COLS * ROWS);   // 0 empty, 1 solid, 2 spike up, 3 spike down
  groups = []; gmap = {}; fakeDoors = []; door = null; spawn = { tx: 1, ty: ROWS - 2 };
  rows.forEach((row, ty) => [...row].forEach((ch, tx) => {
    const i = ty * COLS + tx;
    if (ch === '#') grid[i] = 1;
    else if (ch === '^') grid[i] = 2;
    else if (ch === 'v') grid[i] = 3;
    else if (ch === 'P') spawn = { tx, ty };
    else if (ch === 'D') door = { x: tx * TS, y: ty * TS - TS, y0: ty * TS - TS, tx: 0, ty: 0, speed: 0, moving: false, flee: null };
    else if (ch === 'F') fakeDoors.push({ x: tx * TS, y: ty * TS - TS });
    else if (ch >= 'a' && ch <= 'z') getGroup(ch).tiles.push([tx, ty]);
  }));
  if (L.grudge && grudgeAt) getGroup('~', { spike: 1, hide: 1 }).tiles.push([grudgeAt.tx, grudgeAt.ty]);
  for (const g of groups) g.cx0 = g.tiles.reduce((s, t) => s + t[0] * TS + 4, 0) / g.tiles.length;
  traps = (L.traps || []).map(t => ({ ...t, armed: false, done: false, timer: 0 }));
  if (gmap['~']) traps.push({ when: { near: [grudgeAt.tx, grudgeAt.ty] }, g: '~', do: 'pop', say: pick(QUIPS.grudge),
                              armed: false, done: false, timer: 0 });
  player = newPlayer();
  levelTime = 0; reverseT = 0;
  rec = []; recTick = 0; jumpsThisTry = [];
  setNarr(greet || ((L.pity && levelDeaths >= (L.pityAt || 4)) ? L.pity : L.hint));
  state = 'play';
}

function getGroup(ch, def) {
  if (!gmap[ch]) {
    const d = def || (L.groups && L.groups[ch]) || {};
    const hideOy = d.hide ? (d.down ? -TS : TS) : 0;
    const g = {
      id: ch, d, tiles: [], ox: 0, oy: hideOy, hideOy, vy: 0,
      solid: !d.spike && !d.phantom, spike: !!d.spike, down: !!d.down,
      ghost: !!d.ghost, revealed: false, plat: !!(d.airMove || d.plat || d.cloud),
      state: 'idle', tox: 0, toy: 0, speed: 0, shake: 0, pendingFall: false, gone: false,
    };
    gmap[ch] = g; groups.push(g);
  }
  return gmap[ch];
}

function newPlayer() {
  return { x: spawn.tx * TS + 1, y: spawn.ty * TS + 1, w: 6, h: 7, vx: 0, vy: 0,
           onGround: false, ground: null, coyote: 0, buffer: 0, jumping: false,
           face: 1, alive: true, sx: 1, sy: 1, anim: 0 };
}

/* ============================ 7. PHYSICS =========================== */
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tileAt = (tx, ty) => (tx < 0 || tx >= COLS) ? 1 : (ty < 0 || ty >= ROWS) ? 0 : grid[ty * COLS + tx];

// Every solid rectangle overlapping box b: static tiles, side walls, trap blocks, grudge stones.
function solidsIn(b) {
  const out = [];
  const x0 = Math.floor(b.x / TS), x1 = Math.floor((b.x + b.w - 0.001) / TS);
  const y0 = Math.floor(b.y / TS), y1 = Math.floor((b.y + b.h - 0.001) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++)
    if (tileAt(tx, ty) === 1) out.push({ x: tx * TS, y: ty * TS, w: TS, h: TS, g: null });
  for (const g of groups) {
    if (!g.solid || g.gone) continue;
    for (const [tx, ty] of g.tiles) {
      const r = { x: tx * TS + g.ox, y: ty * TS + g.oy, w: TS, h: TS, g };
      if (overlap(b, r)) out.push(r);
    }
  }
  for (const s of stones) {
    const r = { x: s.tx * TS, y: s.ty * TS, w: TS, h: TS, g: null };
    if (overlap(b, r)) out.push(r);
  }
  return out;
}
const overlapsStatic = b => solidsIn(b).some(s => !s.g);

function touchGroup(g) {
  if (!g) return;
  touched.add(g.id);
  if (g.ghost && !g.revealed) { g.revealed = true; sfx.reveal(); }
}

function moveX(dx) {
  const p = player; p.x += dx;
  for (const s of solidsIn(p)) {
    if (!overlap(p, s)) continue;
    if (dx > 0) p.x = s.x - p.w; else if (dx < 0) p.x = s.x + s.w;
    p.vx = 0; touchGroup(s.g);
  }
}
function moveY(dy) {
  const p = player; p.y += dy;
  for (const s of solidsIn(p)) {
    if (!overlap(p, s)) continue;
    if (dy > 0) { p.y = s.y - p.h; p.onGround = true; p.ground = s.g; }
    else if (dy < 0) { p.y = s.y + s.h; if (p.vy < -60) sfx.bonk(); }
    p.vy = 0; touchGroup(s.g);
  }
}

function updatePlayer(dt) {
  const p = player;
  let mx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (reverseT > 0) mx = -mx;                       // the level is lying to your fingers
  const accel = p.onGround ? (mx ? PH.accG : PH.fric) : (mx ? PH.accA : PH.accIdleAir);
  p.vx = approach(p.vx, mx * PH.run, accel * dt);
  if (mx) p.face = mx;

  p.coyote = p.onGround ? PH.coyote : p.coyote - dt;            // coyote time
  p.buffer = input.jumpPressed ? PH.buffer : p.buffer - dt;     // jump buffering
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -PH.jump; p.buffer = 0; p.coyote = 0; p.jumping = true; p.onGround = false;
    jumped = true; p.sx = 0.7; p.sy = 1.35;
    if (L.grudge) jumpsThisTry.push({ tx: Math.floor((p.x + p.w / 2) / TS), ty: Math.floor((p.y + p.h - 1) / TS) });
    sfx.jump(); dust(p.x + p.w / 2, p.y + p.h, 3);
  }
  if (p.jumping && !input.jump && p.vy < 0) { p.vy *= PH.cut; p.jumping = false; } // variable height
  if (p.vy >= 0) p.jumping = false;
  p.vy = Math.min(p.vy + PH.grav * dt, PH.maxFall);

  const wasGround = p.onGround, fallV = p.vy;
  moveX(p.vx * dt);
  p.onGround = false; p.ground = null;
  moveY(p.vy * dt);
  if (p.onGround && !wasGround && fallV > 90) {                 // landing squash
    const k = Math.min(1, fallV / 300);
    p.sx = 1 + 0.45 * k; p.sy = 1 - 0.35 * k;
    sfx.land(); dust(p.x + p.w / 2, p.y + p.h, 4);
  }
  const ease = Math.min(1, dt * 14);
  p.sx += (1 - p.sx) * ease; p.sy += (1 - p.sy) * ease;
  p.anim += dt * (Math.abs(p.vx) / PH.run) * 12;
}

function checkHazards() {
  const p = player;
  const hb = { x: p.x + 0.5, y: p.y + 0.5, w: p.w - 1, h: p.h - 1 };
  const x0 = Math.floor(hb.x / TS), x1 = Math.floor((hb.x + hb.w) / TS);
  const y0 = Math.floor(hb.y / TS), y1 = Math.floor((hb.y + hb.h) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const v = tileAt(tx, ty);
    if (v === 2 && overlap(hb, { x: tx * TS + 1, y: ty * TS + 3, w: 6, h: 5 })) return kill('spike', { tx, ty });
    if (v === 3 && overlap(hb, { x: tx * TS + 1, y: ty * TS, w: 6, h: 5 })) return kill('spike', { tx, ty });
  }
  for (const g of groups) {
    if (!g.spike || g.gone) continue;
    for (const [tx, ty] of g.tiles) {
      const x = tx * TS + g.ox, y = ty * TS + g.oy;
      const r = g.down ? { x: x + 1, y, w: 6, h: 5 } : { x: x + 1, y: y + 3, w: 6, h: 5 };
      if (overlap(hb, r)) return kill('spike', { tx: Math.round(x / TS), ty: Math.round(y / TS) });
    }
  }
  for (const f of fakeDoors)
    if (overlap(hb, { x: f.x + 2, y: f.y + 4, w: 4, h: 12 })) return kill('door', { tx: f.x / TS, ty: f.y / TS + 1 });
}

/* ============================ 8. TRAPS ============================= */
function updateGroups(dt) {
  const p = player;
  for (const g of groups) {
    if (g.gone) continue;
    const standing = p.alive && p.onGround && p.ground === g;
    const ox0 = g.ox, oy0 = g.oy;
    if (g.shake > 0) { g.shake -= dt; if (g.shake <= 0 && g.pendingFall) { g.state = 'fall'; g.vy = 0; } }

    if (g.state === 'fall') {
      g.vy = Math.min(g.vy + PH.grav * dt, 420);
      let ny = g.oy + g.vy * dt, lim = Infinity;
      for (const [tx, ty] of g.tiles) {                      // land on static ground if any
        const row = Math.floor((ty * TS + ny + TS - 0.01) / TS);
        if (row >= 0 && row < ROWS && tileAt(tx, row) === 1) {
          const l = row * TS - (ty * TS + TS);
          if (l >= g.oy - 0.01) lim = Math.min(lim, l);
        }
      }
      if (lim !== Infinity) {
        ny = lim; g.state = 'landed'; g.vy = 0; shake(3, 0.2); sfx.thud();
        for (const [tx, ty] of g.tiles) dust(tx * TS + 4, ty * TS + ny + TS, 1);
      }
      g.oy = ny;
      if (g.oy > H + 64) g.gone = true;
    } else if (g.state === 'move') {
      const dx = g.tox - g.ox, dy = g.toy - g.oy, d = Math.hypot(dx, dy), step = g.speed * dt;
      if (d <= step) { g.ox = g.tox; g.oy = g.toy; g.state = 'done'; }
      else { g.ox += dx / d * step; g.oy += dy / d * step; }
    } else if (g.state === 'chase') {
      const target = (p.x + p.w / 2) - g.cx0;
      g.ox += clamp(target - g.ox, -g.speed * dt, g.speed * dt);
      if (g.oy > 0) g.oy = Math.max(0, g.oy - 220 * dt);    // rise out of the ground first
    } else if (g.state === 'idle') {
      if (g.d.patrol) {                                      // back-and-forth on a fixed clock
        const P = g.d.patrol, dxT = (P.dx || 0) * TS, dyT = (P.dy || 0) * TS;
        const tr = Math.hypot(dxT, dyT) / ((P.speed || 4) * TS), w = P.wait || 0, cyc = 2 * (tr + w);
        const tt = ((levelTime + (P.phase || 0)) % cyc + cyc) % cyc;
        const f = tt < w ? 0 : tt < w + tr ? (tt - w) / tr : tt < 2 * w + tr ? 1 : 1 - (tt - 2 * w - tr) / tr;
        g.ox = dxT * f; g.oy = dyT * f;
      }
      if (g.d.blink) {                                       // spikes that breathe in and out
        const [per, ph] = g.d.blink;
        const target = ((levelTime + ph) % per) < per / 2 ? g.hideOy : 0;
        g.oy = approach(g.oy, target, 140 * dt);
      }
      // Believer platforms only travel while the player is airborne
      if (g.d.airMove && state === 'play' && p.alive && !p.onGround && g.ox < g.d.airMax * TS)
        g.ox = Math.min(g.d.airMax * TS, g.ox + g.d.airMove * TS * dt);
    }

    const dx = g.ox - ox0, dy = g.oy - oy0;
    if ((dx || dy) && g.solid && p.alive) {
      if (standing && g.state !== 'fall') { p.x += dx; p.y += dy; }
      else for (const [tx, ty] of g.tiles) {                 // push or crush the player
        const r = { x: tx * TS + g.ox, y: ty * TS + g.oy, w: TS, h: TS };
        if (!overlap(p, r)) continue;
        if (dy > 0 && p.y + p.h / 2 > r.y + 4) { kill('crush'); break; }
        if (dy < 0) p.y = r.y - p.h; else if (dx > 0) p.x = r.x + TS; else if (dx < 0) p.x = r.x - p.w;
        if (overlapsStatic(p)) { kill('crush'); break; }
      }
    }
  }
}

function updateDoor(dt) {
  if (!door) return;
  if (door.moving) {
    const dx = door.tx - door.x, dy = door.ty - door.y, d = Math.hypot(dx, dy), step = door.speed * dt;
    if (d <= step) { door.x = door.tx; door.y = door.ty; door.moving = false; dust(door.x + 4, door.y + 16, 3); }
    else { door.x += dx / d * step; door.y += dy / d * step; if (Math.random() < 0.5) dust(door.x + 4, door.y + 16, 1); }
  } else if (door.flee && player.alive) {                    // keeps its distance until cornered
    const dist = door.x + 4 - (player.x + player.w / 2);
    if (dist > -4 && dist < 44 && door.x < door.flee.max) {
      door.x = Math.min(door.flee.max, door.x + door.flee.speed * dt);
      if (Math.random() < 0.3) dust(door.x + 4, door.y + 16, 1);
    }
  }
}

function cond(w) {
  const pcx = (player.x + player.w / 2) / TS;
  if (w.x != null && pcx < w.x) return false;
  if (w.xl != null && pcx > w.xl) return false;
  if (w.up != null && spawn.ty - Math.floor((player.y + player.h / 2) / TS) < w.up) return false;
  if (w.touch && !touched.has(w.touch)) return false;
  if (w.jump && !jumped) return false;
  if (w.deaths != null && levelDeaths < w.deaths) return false;
  if (w.t != null && levelTime < w.t) return false;
  if (w.after != null && !(traps[w.after] && traps[w.after].done)) return false;
  if (w.zone) {                                              // player inside the tile box [x0, y0, x1, y1]
    const pcy = (player.y + player.h / 2) / TS, [x0, y0, x1, y1] = w.zone;
    if (pcx < x0 || pcx > x1 + 1 || pcy < y0 || pcy > y1 + 1) return false;
  }
  if (w.near) {                                              // within a few tiles of [tx, ty]
    const pcy = (player.y + player.h / 2) / TS;
    if (Math.abs(pcx - w.near[0] - 0.5) > 3.5 || Math.abs(pcy - w.near[1] - 0.5) > 2.5) return false;
  }
  return true;
}

// The level holds a grudge: the last spot you jumped from (on plain ground) gets a hidden spike next time.
function pickGrudgeSpot() {
  for (let i = jumpsThisTry.length - 1; i >= 0; i--) {
    const { tx, ty } = jumpsThisTry[i];
    if (tileAt(tx, ty) !== 0 || tileAt(tx, ty + 1) !== 1) continue;
    if (Math.abs(tx - spawn.tx) <= 3 && Math.abs(ty - spawn.ty) <= 1) continue;
    if (door && Math.abs(tx * TS - door.x) < TS * 2) continue;
    if (stones.some(s => s.tx === tx && s.ty === ty)) continue;
    return { tx, ty };
  }
  return grudgeAt;                                           // nothing new to hold against you
}

function updateTraps(dt) {
  for (const t of traps) {
    if (t.done) continue;
    if (!t.armed && cond(t.when || {})) { t.armed = true; t.timer = t.delay || 0; }
    if (t.armed && (t.timer -= dt) <= 0) { fire(t); t.armed = false; if (!t.repeat) t.done = true; }
  }
}

function fire(t) {
  const quiet = levelTime < 0.05;
  if (t.say) setNarr(t.say, !quiet);
  const gs = t.g ? [...t.g].map(c => gmap[c]).filter(Boolean) : [];
  switch (t.do) {
    case 'fall':
      gs.forEach(g => { if (t.shake) { g.shake = t.shake; g.pendingFall = true; } else { g.state = 'fall'; g.vy = 0; } });
      sfx.trap(); break;
    case 'pop':
      gs.forEach(g => { g.state = 'move'; g.tox = g.ox; g.toy = 0; g.speed = 220; }); sfx.pop(); break;
    case 'move':
      gs.forEach(g => { g.state = 'move'; g.tox = (t.dx || 0) * TS; g.toy = (t.dy || 0) * TS; g.speed = (t.speed || 6) * TS; });
      sfx.trap(); break;
    case 'chase':
      gs.forEach(g => { g.state = 'chase'; g.speed = (t.speed || 7) * TS; }); sfx.trap(); break;
    case 'show':
      gs.forEach(g => g.revealed = true); if (!quiet) sfx.reveal(); break;
    case 'vanish':
      gs.forEach(g => { g.gone = true; for (const [tx, ty] of g.tiles) burst(tx * TS + g.ox + 4, ty * TS + g.oy + 4, pal.ink, 5, 60, 0.5); });
      sfx.pop(); break;
    case 'door':
      door.flee = null;
      door.tx = (t.x != null ? t.x : door.x / TS) * TS; door.ty = door.y0 + (t.dy || 0) * TS;
      door.speed = (t.speed || 20) * TS; door.moving = true; sfx.door(); break;
    case 'flee':
      door.flee = { speed: (t.speed || 8) * TS, max: (t.max || 37) * TS }; sfx.door(); break;
    case 'reverse':
      reverseT = t.time || 1.5; sfx.reverse(); break;
  }
}

/* ---- death, grudge stones, juice ---- */
function kill(cause, tile) {
  const p = player;
  if (!p.alive) return;
  p.alive = false; deaths++; levelDeaths++;
  save.deaths = deaths;
  state = 'dead'; deadT = 0; greet = null;
  shake(cause === 'restart' ? 2 : 6, 0.3);
  if (cause !== 'restart') { hitStop = 0.07; flashT = save.shake && !REDUCED ? 0.07 : 0; }
  skullT = 0.35;
  burst(p.x + p.w / 2, p.y + p.h / 2, pal.hero, 26, 150, 0.9);
  burst(p.x + p.w / 2, p.y + p.h / 2, pal.glow, 6, 90, 0.6);
  sfx.die(); if (cause !== 'restart') buzz(35);
  runs.push({ p: rec, dead: true }); if (runs.length > 40) runs.shift();
  if (cause !== 'pit' && cause !== 'crush' && cause !== 'restart') placeStone(tile);
  if (L.grudge) grudgeAt = pickGrudgeSpot();
  // Dying in (nearly) the same place three times in a row earns a special remark
  const here = tile || { tx: Math.floor((p.x + p.w / 2) / TS), ty: Math.floor((p.y + p.h / 2) / TS) };
  const same = cause !== 'restart' && lastDeathTile && Math.abs(lastDeathTile.tx - here.tx) <= 1 && Math.abs(lastDeathTile.ty - here.ty) <= 1;
  sameSpot = same ? sameSpot + 1 : 1; lastDeathTile = here;
  const pool = (QUIPS[cause] || QUIPS.spike).concat(cause === 'restart' ? [] : (L.quips || []));
  msg = deaths % 10 === 0 ? `DEATH #${deaths}. DELIGHTFUL.` : sameSpot >= 3 ? pick(QUIPS.same) : pick(pool);
  msgT = 1.6;
  checkUnlocks(); writeSave();
}

// The signature twist: you leave a solid tombstone where you died. Max 3 per level.
function placeStone(tile) {
  const p = player;
  const t = tile || { tx: Math.floor((p.x + p.w / 2) / TS), ty: Math.floor((p.y + p.h / 2) / TS) };
  if (t.tx < 0 || t.tx >= COLS || t.ty < 0 || t.ty >= ROWS) return;
  if (tileAt(t.tx, t.ty) === 1) return;
  if (t.tx === spawn.tx && t.ty === spawn.ty) return;
  if (stones.some(s => s.tx === t.tx && s.ty === t.ty)) return;
  stones.push({ tx: t.tx, ty: t.ty, born: time });
  if (stones.length > MAX_STONES) {
    const old = stones.shift();
    burst(old.tx * TS + 4, old.ty * TS + 4, pal.ink, 10, 70, 0.7);
  }
}

function shake(mag, dur) {
  if (!save.shake) return;
  shakeMag = Math.max(shakeT > 0 ? shakeMag : 0, mag * (REDUCED ? 0.3 : 1));
  shakeT = Math.max(shakeT, dur);
}
function burst(x, y, color, n, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, g: 420,
                     life: life * (0.5 + Math.random() * 0.5), color, size: Math.random() < 0.3 ? 2 : 1 });
  }
}
function dust(x, y, n) {
  for (let i = 0; i < n; i++) {
    const side = i % 2 ? 1 : -1;
    particles.push({ x: x + side * 2, y: y - 1, vx: side * (20 + Math.random() * 30), vy: -10 - Math.random() * 20,
                     g: 60, life: 0.25 + Math.random() * 0.15, color: pal.ink, size: 1 });
  }
}
function updateParticles(dt) {
  for (const q of particles) { q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
}

/* =========================== 9. RENDERING ========================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const pad2 = n => String(n).padStart(2, '0');
let hits = [];                    // clickable regions registered by the last rendered frame
const hit = (x, y, w, h, id) => hits.push({ x, y, w, h, id });

// Fit the canvas into whatever the body's padding leaves free (that padding makes room for phone controls).
function resize() {
  const touch = !pad.hidden, land = innerWidth > innerHeight;
  document.body.classList.toggle('touch', touch);
  document.body.classList.toggle('land', touch && land);
  turnHint.hidden = !touch || land;
  const cs = getComputedStyle(document.body), px = k => parseFloat(cs[k]) || 0;
  const aw = innerWidth - px('paddingLeft') - px('paddingRight');
  const ah = innerHeight - px('paddingTop') - px('paddingBottom') - (turnHint.hidden ? 0 : turnHint.offsetHeight + 12);
  let s = Math.min(Math.max(160, aw) / W, Math.max(90, ah) / H);
  if (s >= 2) s = Math.floor(s);                      // integer scaling keeps pixels square
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', resize);

function drawSprite(img, x, y, flip = false, w = img.width, h = img.height) {
  x = Math.round(x); y = Math.round(y);
  if (!flip) return ctx.drawImage(img, x, y, w, h);
  ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, w, h); ctx.restore();
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) {                         // aliasing-free pixel circle
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1); }
}
function tri(cx, baseY, h, half, c) {                 // flat pixel triangle
  ctx.fillStyle = c;
  for (let r = 0; r < h; r++) { const w = Math.round(half * (r + 1) / h); ctx.fillRect(Math.round(cx - w), Math.round(baseY - h + r), w * 2, 1); }
}
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// Each phase gets one flat backdrop motif drawn in its fifth color, behind everything.
function drawBackdrop(motif, t) {
  const c = pal.deco, R = rng(7);
  switch (motif) {
    case 'sun':
      disc(252, 46, 22, c);
      for (const [x, r] of [[30, 46], [130, 60], [236, 50], [330, 44]]) disc(x, 168, r, c);
      break;
    case 'garden':
      for (let i = 0; i < 15; i++) {
        const x = 8 + i * 22 + Math.floor(R() * 8), h = 40 + Math.floor(R() * 60);
        const sway = Math.round(Math.sin(t * 1.2 + i) * 1);
        rect(x, 180 - h, 2, h, c); disc(x + 1 + sway, 180 - h, 4 + Math.floor(R() * 3), c);
      }
      break;
    case 'city':
      for (let x = -6; x < W; ) {
        const w = 16 + Math.floor(R() * 18), h = 50 + Math.floor(R() * 70);
        rect(x, 180 - h, w, h, c);
        for (let wy = 180 - h + 6; wy < 176; wy += 8) for (let wx = x + 4; wx < x + w - 4; wx += 6)
          if (R() < 0.55) rect(wx, wy, 2, 3, pal.bg);
        x += w + 4;
      }
      break;
    case 'arches':
      for (let i = 0; i < 6; i++) {
        const x = i * 64 - 10;
        rect(x, 0, 64, 40, c); disc(x + 37, 40, 22, pal.bg); rect(x + 15, 40, 45, 140, pal.bg);
        rect(x, 0, 12, 180, c);
      }
      break;
    case 'graves':
      disc(56, 40, 14, c); disc(62, 35, 12, pal.bg);
      for (let i = 0; i < 12; i++) {
        const x = 10 + i * 27 + Math.floor(R() * 8), h = 12 + Math.floor(R() * 10), w = 10 + Math.floor(R() * 4);
        const y = 110 + Math.floor(R() * 20);
        rect(x, y - h, w, h + 80, c); disc(x + w / 2, y - h, w / 2, c);
        if (R() < 0.5) { rect(x + w / 2 - 1, y - h - 2, 2, 7, pal.bg); rect(x + w / 2 - 3, y - h, 6, 2, pal.bg); }
      }
      break;
    case 'dunes':
      disc(232, 50, 18, c);
      tri(70, 150, 56, 64, c); tri(150, 150, 76, 84, c); tri(250, 150, 44, 52, c);
      rect(0, 150, W, 30, c);
      break;
    case 'mirrors':
      for (let i = 0; i < 6; i++) {
        const x = 14 + i * 54;
        disc(x + 13, 40, 13, c); rect(x, 40, 27, 140, c);
        disc(x + 13, 42, 9, pal.bg); rect(x + 4, 42, 19, 138, pal.bg);
        const gy = 60 + ((i * 37 + Math.floor(t * 20)) % 100);
        rect(x + 8, gy, 2, 10, c);
      }
      break;
    case 'clouds':
      for (let i = 0; i < 6; i++) {
        const x = ((i * 71 + t * (4 + i)) % 400) - 40, y = 24 + (i * 37) % 90;
        disc(x, y, 9, c); disc(x + 12, y - 5, 12, c); disc(x + 26, y, 9, c); rect(x, y, 26, 9, c);
      }
      break;
    case 'peaks':
      tri(50, 180, 110, 90, c); tri(170, 180, 140, 110, c); tri(290, 180, 100, 80, c);
      for (let i = 0; i < 9; i++) {
        const x = W - ((i * 53 + t * (90 + i * 10)) % (W + 40)), y = 30 + i * 13;
        rect(x, y, 14 + (i % 3) * 6, 1, c);
      }
      break;
    case 'eyes': {                                    // they watch you, and blink now and then
      const live = player && (state === 'play' || state === 'dead' || state === 'exit');
      const lx = live ? player.x + 3 : W / 2, ly = live ? player.y + OY : 100;
      for (const [ex, ey, r] of [[38, 42, 12], [118, 28, 9], [196, 50, 14], [282, 30, 10], [78, 124, 10], [252, 120, 12]]) {
        if (((t * 0.6 + ex * 0.011) % 4) < 0.14) { rect(ex - r, ey, r * 2 + 1, 2, c); continue; }
        disc(ex, ey, r, c);
        const a = Math.atan2(ly - ey, lx - ex), pr = Math.round(r * 0.45);
        disc(ex + Math.round(Math.cos(a) * (r - pr - 1)), ey + Math.round(Math.sin(a) * (r - pr - 1)), pr, pal.bg);
      }
      break;
    }
    case 'heart': {
      for (let i = 0; i < 40; i++) { const x = R() * W, y = R() * 140; if (((t * 2 + i) | 0) % 5) rect(x, y, 1, 1, c); }
      const r = 22 + ((t * 1.6 | 0) % 2);
      disc(140, 58, r, c); disc(180, 58, r, c);
      for (let row = 0; row < 46; row++) { const w = Math.round((r * 2 - 2) * (1 - row / 46)); rect(160 - w, 62 + row, w * 2, 1, c); }
      break;
    }
  }
}

function render() {
  hits = [];
  const inLevel = state === 'play' || state === 'dead';
  if (bX.hidden === inLevel) bX.hidden = !inLevel;     // the phone R button only makes sense in a level
  pad.classList.toggle('editing', state === 'editor');
  ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, W, H);
  if (state === 'title') drawHome();
  else if (state === 'phases') drawPhases();
  else if (state === 'levels') drawLevels();
  else if (state === 'card') drawPhaseCard();
  else if (state === 'ending') drawEnding();
  else if (state === 'skins') drawSkins();
  else if (state === 'editor') drawEditor();
  else if (state === 'shared') drawSharedCard();
  else drawGame();
  if (flashT > 0) { ctx.globalAlpha = 0.45; ctx.fillStyle = pal.glow; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawToast();
  drawFade();
}

function drawGame() {
  drawBackdrop(PHASES[L.phase].motif, time);
  let sx = 0, sy = 0;
  if (shakeT > 0) {
    const m = shakeMag * Math.min(1, shakeT / 0.2);
    sx = Math.round((Math.random() * 2 - 1) * m); sy = Math.round((Math.random() * 2 - 1) * m);
  }
  ctx.save(); ctx.translate(sx, OY + sy);

  // Trap groups first, so hidden spikes tuck behind the ground drawn over them
  for (const g of groups) {
    if (g.gone || (g.ghost && !g.revealed)) continue;
    const jx = g.shake > 0 ? (Math.random() * 3 | 0) - 1 : 0;
    for (const [tx, ty] of g.tiles) {
      const x = Math.round(tx * TS + g.ox + jx), y = Math.round(ty * TS + g.oy);
      if (g.spike) drawSprite(g.down ? SPR.spikeDown : SPR.spike, x, y);
      else if (g.plat) drawSprite(SPR.plat, x, y);
      else { ctx.fillStyle = pal.ink; ctx.fillRect(x, y, TS, TS); }
    }
  }
  ctx.fillStyle = pal.ink;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    const v = grid[ty * COLS + tx];
    if (v === 1) ctx.fillRect(tx * TS, ty * TS, TS, TS);
    else if (v === 2) ctx.drawImage(SPR.spike, tx * TS, ty * TS);
    else if (v === 3) ctx.drawImage(SPR.spikeDown, tx * TS, ty * TS);
  }
  for (const s of stones) {
    const k = Math.min(1, (time - s.born) / 0.18);
    drawSprite(SPR.stone, s.tx * TS, s.ty * TS - Math.round((1 - k) * 6));
  }
  for (const f of fakeDoors) drawSprite(SPR.door, f.x, f.y);
  if (door) drawSprite(SPR.door, door.x, door.y);
  if (state === 'replay') drawReplay(); else drawPlayer();
  for (const q of particles) { ctx.fillStyle = q.color; ctx.fillRect(Math.round(q.x), Math.round(q.y), q.size, q.size); }
  ctx.restore();
  drawHUD();
}

function drawPlayer() {
  const p = player;
  if (!p.alive && state !== 'exit') return;
  let frame = 'idle0';
  if (!p.onGround) frame = p.vy < 0 ? 'jump' : 'fall';
  else if (Math.abs(p.vx) > 8) frame = RUN_CYCLE[Math.floor(p.anim) % 4];
  else if (time % 3.2 < 0.14) frame = 'idle1';
  let sx = p.sx, sy = p.sy, cx = p.x + p.w / 2, by = p.y + p.h;
  if (state === 'exit') {                              // shrink into the door
    const k = Math.min(1, exitT / 0.35);
    cx += (door.x + 4 - cx) * k; by += (door.y + 15 - by) * k;
    sx = sy = Math.max(0, 1 - k);
  }
  if (sx <= 0) return;
  const img = SPR[frame];
  const w = Math.max(1, Math.round(img.width * sx)), h = Math.max(1, Math.round(img.height * sy));
  drawSprite(img, cx - w / 2, by - h, p.face < 0, w, h);
}
// Hero sprites can be taller than 8px (hats), so menus place them by their feet.
function drawHero(frame, x, bottom, flip = false) { const img = SPR[frame]; drawSprite(img, x, bottom - img.height, flip); }

// Every attempt at this level, replayed at once: dead ones fade to a skull, the winner walks out.
function drawReplay() {
  const idx = Math.floor(replayT * replaySpeed * 30);
  runs.forEach((r, n) => {
    const len = r.p.length / 3;
    if (!len) return;
    const i = Math.min(idx, len - 1), x = r.p[i * 3], y = r.p[i * 3 + 1];
    if (idx >= len) { if (r.dead) ctx.drawImage(SPR.skull, x, y + 2); return; }
    const px = i ? r.p[i * 3 - 3] : x, py = i ? r.p[i * 3 - 2] : y;
    const fr = y < py ? 'jump' : y > py ? 'fall' : x !== px ? RUN_CYCLE[(i >> 1) % 4] : 'idle0';
    ctx.globalAlpha = n === runs.length - 1 ? 1 : 0.45;
    drawHero(fr, x - 1, y + 7, !!r.p[i * 3 + 2]);
    ctx.globalAlpha = 1;
  });
}
function updateReplay() {
  const idx = Math.floor(replayT * replaySpeed * 30);
  for (const r of runs) {
    const len = r.p.length / 3;
    if (!r.dead || r.popped || !len || idx < len) continue;
    r.popped = true;
    burst(r.p[len * 3 - 3] + 3, r.p[len * 3 - 2] + 3, pal.hero, 10, 100, 0.6);
    if (time - lastPoof > 0.06) { sfx.poof(); lastPoof = time; }
  }
}

function band(y, h, c = pal.ink) { rect(0, y, W, h, c); }

function drawHUD() {
  const label = levelLabel(L) + '  ' + L.name;
  text('<', 4, 3, pal.ink); text(label, 12, 3, pal.ink);
  hit(0, 0, 16 + textW(label), 12, 'menu');
  const ds = String(deaths), bump = skullT > 0 ? Math.round(Math.sin(skullT / 0.35 * Math.PI) * 3) : 0;
  text(ds, W - 4, 3 - bump, pal.ink, 1, 'right');
  ctx.drawImage(SPR.skull, W - 4 - textW(ds) - 8, 3 - bump);
  if (state === 'replay') {
    text('ALL ' + runs.length + ' ATTEMPTS AT ONCE', W / 2, 13, pal.ink, 1, 'center');
    if ((time * 2 | 0) % 2 === 0) text('JUMP TO SKIP', W / 2, 21, pal.hero, 1, 'center');
    return;
  }
  // Typewriter: centered on the full line so it does not slide while it types
  const full = '"' + narr + '"';
  text(narrN >= narr.length ? full : '"' + narr.slice(0, narrN), Math.round(W / 2 - textW(full) / 2), 13, pal.ink);
  if (state === 'play' && msgT > 0 && levelTime < 1.6) text(msg, W / 2, 21, pal.hero, 1, 'center');
  if (reverseT > 0 && (time * 8 | 0) % 2 === 0) text('< CONTROLS REVERSED >', W / 2, 29, pal.hero, 1, 'center');
  if (introT > 0 && levelDeaths === 0 && state === 'play') {
    band(bannerY, 34);
    text((L.custom ? 'CUSTOM LEVEL' : 'LEVEL ' + levelLabel(L)) + '   ' + PHASES[L.phase].name, W / 2, bannerY + 6, pal.bg, 1, 'center');
    text(L.name, W / 2, bannerY + 17, pal.bg, 2, 'center');
  }
  if (state === 'dead') { band(bannerY + 6, 22); text(msg, W / 2, bannerY + 12, pal.bg, 2, 'center'); }
}

function drawToast() {
  if (toastT <= 0) return;
  const w = textW(toast) + 10, y = toastT > 2.4 ? 180 - (2.6 - toastT) * 70 : 166;   // slides up, then sits
  rect(W / 2 - w / 2, y, w, 11, pal.glow); rect(W / 2 - w / 2, y, w, 1, pal.ink);
  text(toast, W / 2, y + 3, pal.ink, 1, 'center');
}

function drawFade() {
  if (fade.a <= 0) return;
  ctx.globalAlpha = Math.ceil(fade.a * 4) / 4;          // stepped, not smooth
  ctx.fillStyle = pal.ink; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

/* ============================ 10. AUDIO ============================ */
let AC = null, muted = false, noiseBuf = null;
function initAudio() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) try { AC = new C(); } catch (_) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function cycleSound() { save.sound = (save.sound + 2) % 3; muted = save.sound === 0; writeSave(); }   // all > sfx > off
function tone(f0, f1, dur, type = 'square', vol = 0.1, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 1500, delay = 0) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  jump:    () => tone(260, 560, 0.09, 'square', 0.07),
  land:    () => tone(120, 55, 0.06, 'triangle', 0.14),
  bonk:    () => tone(220, 140, 0.05, 'square', 0.06),
  die:     () => { noise(0.4, 0.28, 2600); tone(420, 45, 0.38, 'sawtooth', 0.07); },
  trap:    () => { tone(190, 110, 0.08, 'square', 0.07); tone(110, 60, 0.12, 'square', 0.07, 0.07); },
  pop:     () => tone(1100, 280, 0.06, 'square', 0.06),
  thud:    () => noise(0.18, 0.3, 600),
  door:    () => { tone(520, 980, 0.07, 'triangle', 0.08); tone(980, 520, 0.07, 'triangle', 0.08, 0.07); },
  reveal:  () => tone(880, 1320, 0.09, 'triangle', 0.08),
  reverse: () => { tone(300, 640, 0.08, 'square', 0.06); tone(640, 300, 0.08, 'square', 0.06, 0.08); },
  say:     () => tone(740, 740, 0.03, 'square', 0.035),
  move:    () => tone(520, 520, 0.03, 'square', 0.04),
  ok:      () => [392, 523, 784].forEach((f, i) => tone(f, f, 0.07, 'square', 0.06, i * 0.05)),
  back:    () => tone(400, 200, 0.07, 'square', 0.05),
  nope:    () => tone(140, 110, 0.12, 'square', 0.06),
  win:     () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 'square', 0.06, i * 0.07)),
  poof:    () => tone(320, 90, 0.06, 'square', 0.035),
};

/* ---- music: one little loop per phase (same order as PHASES). Steps are eighth notes, 8 per bar.
   lead: scale degrees 0-9, '-' holds the note before, '.' rests (spaces are only for reading).
   chords: the bass note's scale degree, one per bar.  bass: one bar of rhythm, 'x' plays.  */
const SCALES = { maj: [0, 2, 4, 5, 7, 9, 11], min: [0, 2, 3, 5, 7, 8, 10], dor: [0, 2, 3, 5, 7, 9, 10],
                 mix: [0, 2, 4, 5, 7, 9, 10], phr: [0, 1, 3, 5, 7, 8, 10], hij: [0, 1, 4, 5, 7, 8, 10],
                 pent: [0, 2, 4, 7, 9] };
const SONGS = [
  { bpm: 116, root: 72, scale: 'maj',  chords: [0, 5, 3, 4], bass: 'x...x.x.', lead: '0.2.4.2. 5-4-2... 3.5.7.5. 4---1...' },
  { bpm: 100, root: 74, scale: 'pent', chords: [0, 4, 3, 0], bass: 'x...x...', lead: '4.3.2... 4.3.5... 6-5-4-3- 2---....' },
  { bpm: 138, root: 69, scale: 'mix',  chords: [0, 0, 6, 3], bass: 'x.x.x.xx', lead: '0.0.2.4. 6.4.2... 0.0.2.4. 5-4-3-2-', hat: 1 },
  { bpm: 92,  root: 62, scale: 'min',  chords: [0, 5, 3, 4], bass: 'x..x..x.', lead: '0...2.3. 4-3-2... 0...2.3. 1---....' },
  { bpm: 104, root: 64, scale: 'phr',  chords: [0, 0, 5, 1], bass: 'x.x...x.', lead: '0.4.3.0. 2.1.0... 0.4.5.4. 3---....' },
  { bpm: 108, root: 62, scale: 'hij',  chords: [0, 0, 1, 0], bass: 'x..x.x..', lead: '4.3.2.1. 2---.... 4.5.4.3. 2.1.0...' },
  { bpm: 120, root: 65, scale: 'dor',  chords: [0, 3, 0, 4], bass: 'x...x...', lead: '0.2.4.6. 4.2.0... 6.4.2.0. 2---....' },
  { bpm: 96,  root: 72, scale: 'pent', chords: [0, 3, 4, 0], bass: 'x.......', lead: '4-3-2-0- 1-2-3--- 4-5-6-5- 4---....' },
  { bpm: 168, root: 64, scale: 'min',  chords: [0, 5, 6, 4], bass: 'x.x.x.x.', lead: '0.0.3.0. 4.0.3.2. 0.0.3.0. 6.5.4.2.', hat: 1 },
  { bpm: 84,  root: 60, scale: 'min',  chords: [0, 5, 2, 6], bass: 'x...x...', lead: '4---3--- 2-1-0--- 4---5--- 4-------' },
  { bpm: 126, root: 62, scale: 'min',  chords: [0, 0, 5, 4], bass: 'x.xx.x.x', lead: '0.0.0.3. 2.0..... 0.0.0.5. 4.3.2.1.', hat: 1 },
];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const degree = (sc, d) => sc[d % sc.length] + 12 * Math.floor(d / sc.length);
const music = { song: -1, step: 0, next: 0 };
function updateMusic() {                              // schedules a little ahead on the audio clock
  if (!AC || AC.state !== 'running' || save.sound < 2 || palPhase < 0) return;
  if (palPhase !== music.song) { music.song = palPhase; music.step = 0; music.next = AC.currentTime + 0.1; }
  const S = SONGS[music.song], lead = S.lead.replace(/ /g, ''), sc = SCALES[S.scale], spb = 30 / S.bpm;
  if (music.next < AC.currentTime) music.next = AC.currentTime + 0.05;          // fell behind (tab was hidden)
  while (music.next < AC.currentTime + 0.15) {
    const st = music.step, at = music.next - AC.currentTime, ch = lead[st % lead.length], beat = st % 8;
    if (ch >= '0' && ch <= '9') {
      let len = 1; while (lead[(st + len) % lead.length] === '-' && len < 8) len++;
      tone(hz(S.root + degree(sc, +ch)), 0, spb * len * 0.9, 'square', 0.022, at);
    }
    if (S.bass[beat] === 'x') tone(hz(S.root - 24 + degree(sc, S.chords[(st >> 3) % S.chords.length])), 0, spb * 0.9, 'triangle', 0.08, at);
    if (S.hat && beat % 2) noise(0.03, 0.03, 7000, at);
    music.step++; music.next += spb;
  }
}

/* ============================ 11. MENUS ============================ */
let homeSel = 0, phaseSel = 0, levelPhase = 0, levelSel = 0, cardLevel = 0, cardT = 0;
const demo = { x: 60, dir: 1, door: 280, doorTo: 280, anim: 0, wait: 0 };

let homeOpts = false;                              // showing the OPTIONS sub-menu
const homeItems = () => homeOpts ? [
  { label: ['SOUND  OFF', 'SFX ONLY', 'MUSIC + SFX'][save.sound], id: 'sound' },
  { label: save.shake ? 'SHAKE  ON' : 'SHAKE  OFF', id: 'shake' },
  { label: 'BACK', id: 'back' },
] : [
  { label: clearedCount() ? 'CONTINUE' : 'PLAY', id: 'play' },
  { label: 'PHASES', id: 'phases' },
  { label: 'SKINS', id: 'skins' },
  { label: 'MAKE A LEVEL', id: 'make' },
  { label: 'OPTIONS', id: 'options' },
];

function goHome() { state = 'title'; menuT = 0; homeOpts = false; homeSel = Math.min(homeSel, 4); setPalette(themePhase()); }
function goPhases(sel) { state = 'phases'; menuT = 0; phaseSel = sel != null ? sel : themePhase(); setPalette(themePhase()); }
function goLevels(p, sel) {
  state = 'levels'; menuT = 0; levelPhase = p; setPalette(p);
  if (sel == null) { sel = 0; for (let k = 0; k < 5; k++) if (isUnlocked(p * 5 + k)) sel = k; for (let k = 0; k < 5; k++) if (isUnlocked(p * 5 + k) && !isCleared(p * 5 + k)) { sel = k; break; } }
  levelSel = sel;
}
function goCard(i) { state = 'card'; cardLevel = i; cardT = 0; setPalette(LEVELS[i].phase); }
function playFrom(i) { if (i % 5 === 0 && !isCleared(i)) goCard(i); else loadLevel(i); }

function hitAt(pt) { if (!pt) return null; for (const h of hits) if (pt.x >= h.x && pt.x < h.x + h.w && pt.y >= h.y && pt.y < h.y + h.h) return h.id; return null; }

function updateHome(dt) {
  menuT += dt;
  // The demo hero chases a door that keeps running off - the game in miniature.
  demo.anim += dt * 8;
  if (demo.wait > 0) demo.wait -= dt; else demo.x += demo.dir * 46 * dt;
  demo.door = approach(demo.door, demo.doorTo, 420 * dt);
  if (demo.dir > 0 && demo.doorTo > 160 && demo.x > demo.doorTo - 46) { demo.doorTo = 24; demo.dir = -1; demo.wait = 0.5; sfx.door(); }
  if (demo.dir < 0 && demo.doorTo < 160 && demo.x < demo.doorTo + 40) { demo.doorTo = 288; demo.dir = 1; demo.wait = 0.5; sfx.door(); }

  const items = homeItems();
  if (homeOpts && input.presses.has('back')) { homeOpts = false; homeSel = 4; sfx.back(); return; }
  const hov = hitAt(input.hover);
  if (hov && hov.startsWith('home:')) homeSel = +hov.slice(5);
  homeSel = Math.min(homeSel, items.length - 1);          // the two menus have different lengths
  if (input.presses.has('up') || input.presses.has('left')) { homeSel = (homeSel + items.length - 1) % items.length; sfx.move(); }
  if (input.presses.has('down') || input.presses.has('right')) { homeSel = (homeSel + 1) % items.length; sfx.move(); }
  let pick = input.presses.has('ok') ? homeSel : null;
  const tap = hitAt(input.tap);
  if (tap && tap.startsWith('home:')) pick = +tap.slice(5);
  if (pick == null || !items[pick]) return;
  const id = items[pick].id;
  if (id === 'sound') { cycleSound(); sfx.ok(); return; }
  if (id === 'shake') { save.shake = !save.shake; writeSave(); sfx.ok(); shake(3, 0.2); return; }
  if (id === 'options') { homeOpts = true; homeSel = 0; sfx.ok(); return; }
  if (id === 'back') { homeOpts = false; homeSel = 4; sfx.back(); return; }
  sfx.ok();
  if (id === 'play') { const i = firstOpenLevel(); fadeTo(() => i < 0 ? goPhases(0) : playFrom(i)); }
  else if (id === 'skins') fadeTo(goSkins);
  else if (id === 'make') fadeTo(goEditor);
  else fadeTo(() => goPhases());
}

function drawHome() {
  drawBackdrop(PHASES[palPhase].motif, menuT);
  const gy = H - 26;
  rect(0, gy, W, 26, pal.ink);
  // Title with a chunky drop shadow
  text('GRUDGE', W / 2 + 2, 10, pal.hero, 7, 'center');
  text('GRUDGE', W / 2, 8, pal.ink, 7, 'center');
  text('THE LEVEL NEVER FORGETS. NEITHER DO YOU.', W / 2, 48, pal.ink, 1, 'center');
  // Menu buttons
  homeItems().forEach((it, i) => {
    const w = 92, h = 13, x = W / 2 - w / 2, y = 58 + i * 18, sel = i === homeSel;
    const lift = sel ? -2 : 0;
    if (sel) rect(x + 2, y + 2, w, h, pal.hero);
    rect(x, y + lift, w, h, sel ? pal.glow : pal.ink);
    text(it.label, W / 2, y + 4 + lift, sel ? pal.ink : pal.bg, 1, 'center');
    if (sel) drawHero((menuT * 3 | 0) % 2 ? 'idle0' : 'jump', x - 14, y + 11 + lift);
    hit(x, y - 2, w, h + 4, 'home:' + i);
  });
  // Ground scene
  drawSprite(SPR.door, demo.door, gy - 16);
  const fr = demo.wait > 0 ? 'idle0' : RUN_CYCLE[Math.floor(demo.anim) % 4];
  drawHero(fr, demo.x, gy, demo.dir < 0);
  text(`DEATHS ${deaths}     CLEARED ${clearedCount()} / ${LEVELS.length}`, W / 2, gy + 6, pal.glow, 1, 'center');
  text('ARROWS / WASD MOVE   SPACE JUMP   R RESTART   ESC MENU   M SOUND', W / 2, gy + 16, pal.bg, 1, 'center');
}

/* ---- skins ---- */
let skinSel = 0;
function goSkins() { state = 'skins'; menuT = 0; skinSel = Math.max(0, SKINS.findIndex(s => s.id === save.skin)); setPalette(themePhase()); }

function updateSkins(dt) {
  menuT += dt;
  const hov = hitAt(input.hover);
  if (hov && hov.startsWith('sk:')) skinSel = +hov.slice(3);
  const pr = input.presses, N = SKINS.length;
  if (pr.has('left')) { skinSel = (skinSel + N - 1) % N; sfx.move(); }
  if (pr.has('right')) { skinSel = (skinSel + 1) % N; sfx.move(); }
  if (pr.has('up') || pr.has('down')) { skinSel = (skinSel + 6) % N; sfx.move(); }
  const tap = hitAt(input.tap);
  if (pr.has('back') || tap === 'back') { sfx.back(); return fadeTo(goHome); }
  let choice = pr.has('ok') ? skinSel : null;
  if (tap && tap.startsWith('sk:')) choice = skinSel = +tap.slice(3);
  if (choice == null) return;
  const s = SKINS[choice];
  if (!skinUnlocked(s)) { sfx.nope(); shake(2, 0.15); return; }
  save.skin = s.id; writeSave(); bakeSprites(); sfx.ok();
}

function drawSkins() {
  drawBackdrop(PHASES[palPhase].motif, menuT);
  text('< BACK', 6, 6, pal.ink); hit(0, 0, 40, 16, 'back');
  text('SKINS', W / 2, 8, pal.ink, 2, 'center');
  // Big preview of the highlighted skin, hopping in place (a silhouette while locked)
  const s = SKINS[skinSel], open = skinUnlocked(s), worn = s.id === save.skin;

  const hop = open ? Math.round(Math.max(0, Math.sin(menuT * 4)) * 10) : 0;
